<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<script type="module">
// Electric Man yeni görünüm önizlemesi: 0 = şimdiki kablo, 1-6 = yeni kablo + mekânlar
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const q = new URLSearchParams(location.search), W = +q.get('w') || 900, H = +q.get('h') || 1100;
const R = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true}); R.setSize(W, H); R.setPixelRatio(1);
R.toneMapping = THREE.ACESFilmicToneMapping; R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(R.domElement);
const cam = new THREE.PerspectiveCamera(38, W / H, .1, 100); cam.position.set(0, 9.2, 6.6); cam.lookAt(0, 0, .35);
const std = (c, o = {}) => new THREE.MeshStandardMaterial({color:c, roughness:.7, ...o});
const V = (x, y, z) => new THREE.Vector3(x, y, z);
// harita: 1=K 2=D 4=G 8=B
const GRID = [
 ['H2', 10, 14, 10, 'H8'],
 [ 3,  6,  5,  12,  9 ],
 ['H2', 10, 'T', 10, 'H8'],
 [ 6,  3,  5,  9,  12 ],
 ['H2', 10, 11, 10, 'H8']];
const POWER = new Set(['0,1','0,2','0,3','1,2','2,1','2,3','3,2','4,1','4,2','4,3']);
const BROKEN = '4,3';
const THEMES = [
 {ad:'eski', bg:0xbfe3f5, base:0x5fb556, tile:0xf1ebde, old:true},
 {ad:'mahalle', bg:0xbfe3f5, base:0x5fb556, tile:0xf1ebde, deco:'clip'},
 {ad:'köy', bg:0xf3d9a8, base:0x9a7348, tile:0xd9c39a, deco:'pole', sag:true},
 {ad:'şehir', bg:0xb8c4d2, base:0x55595f, tile:0xb9bcc0, deco:'duct'},
 {ad:'fabrika', bg:0x8d96a3, base:0x3b3f46, tile:0x6f757e, deco:'tray'},
 {ad:'kış', bg:0xdfeaf5, base:0xf4f8fc, tile:0xcfe3f2, deco:'pole', sag:true, snow:true},
 {ad:'fırtına', bg:0x0d1424, base:0x1d2a3d, tile:0x2e3c52, deco:'clip', night:true},
];
let scene, comp;
function wireCurves(a, b, sag, Y){ // a,b kenar noktaları -> merkez
  const pts = []; for (let i = 0; i <= 24; i++){ const k = i / 24; const x = a[0] + (b[0] - a[0]) * k, z = a[1] + (b[1] - a[1]) * k; const y = sag ? Y + .32 - .2 * Math.sin(Math.PI * k) : Y; pts.push(V(x, y, z)); } return new THREE.CatmullRomCurve3(pts); }
function segs(mask){ const s = []; const E = {1:[0,-.5], 2:[.5,0], 4:[0,.5], 8:[-.5,0]}; const arms = [1,2,4,8].filter(b => mask & b);
  if (arms.length === 2 && !((mask === 5) || (mask === 10))){ const [p, r] = arms.map(b => E[b]); const pts = []; for (let i = 0; i <= 20; i++){ const k = i / 20; const cx = p[0] + r[0], cz = p[1] + r[1]; const a0 = Math.atan2(p[1] - cz, p[0] - cx), a1 = Math.atan2(r[1] - cz, r[0] - cx); let d = a1 - a0; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; const a = a0 + d * k; pts.push([cx + .5 * Math.cos(a), cz + .5 * Math.sin(a)]); } return [pts]; }
  if (mask === 5) return [[E[1], E[4]]]; if (mask === 10) return [[E[8], E[2]]];
  return arms.map(b => [E[b], [0, 0]]); }
function build(th){
  scene = new THREE.Scene(); scene.background = new THREE.Color(th.bg); scene.fog = new THREE.Fog(th.bg, 14, 30);
  scene.add(new THREE.HemisphereLight(th.night ? 0x5470a0 : 0xffffff, th.night ? 0x0a0f1a : 0x8a7a60, th.night ? .5 : 1.4));
  const sun = new THREE.DirectionalLight(th.night ? 0x8fa8ff : 0xfff2dc, th.night ? .6 : 2.2); sun.position.set(-4, 9, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left:-5, right:5, top:5, bottom:-5}); scene.add(sun);
  const base = new THREE.Mesh(new RoundedBoxGeometry(5.6, .3, 5.6, 3, .08), std(th.base, {roughness:.95})); base.position.y = -.2; base.receiveShadow = true; scene.add(base);
  const tileM = std(th.tile, {roughness: th.snow ? .3 : .85, metalness: th.deco === 'tray' ? .3 : 0});
  const BR = std(0x7a4a24, {roughness:.5}), BL = std(0x2f6fd0, {roughness:.5}), YG = std(0x5fae3a, {roughness:.5}), CU = std(0xc77b3a, {metalness:1, roughness:.3});
  const ON = c => std(c, {emissive:0xff8a00, emissiveIntensity:.9, roughness:.4});
  const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const r = g.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.3,'rgba(255,220,120,.8)'); r.addColorStop(1,'rgba(255,160,0,0)'); g.fillStyle = r; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })();
  const pulseM = new THREE.SpriteMaterial({map:glowTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending});
  GRID.forEach((row, r) => row.forEach((cell, c) => {
    const g = new THREE.Group(); g.position.set(c - 2, 0, r - 2); scene.add(g); const key = r + ',' + c;
    const tile = new THREE.Mesh(new RoundedBoxGeometry(.9, .1, .9, 2, .025), typeof cell === 'string' && cell[0] === 'H' ? std(th.snow ? 0xffffff : th.night ? 0x24402c : 0x7fc46a, {roughness:.95}) : tileM); tile.receiveShadow = true; g.add(tile);
    if (typeof cell === 'string'){
      if (cell === 'T'){ const t = new THREE.Mesh(new RoundedBoxGeometry(.5, .5, .4, 2, .03), std(0x9aa3ad, {metalness:.5, roughness:.4})); t.position.y = .3; t.castShadow = true; g.add(t);
        const s = new THREE.Mesh(new THREE.BoxGeometry(.16, .16, .01), std(0xffd23f, {emissive:0xffb800, emissiveIntensity:.5})); s.position.set(0, .34, .205); g.add(s); }
      else { const col = [0xe5484d, 0x3a8dde, 0xf2a93b, 0x8f5bd6, 0x2fb39a][(r + c) % 5]; const h = new THREE.Group(); h.position.y = .05; g.add(h);
        const wall = new THREE.Mesh(new THREE.BoxGeometry(.48, .32, .4), std(new THREE.Color(col).lerp(new THREE.Color(0xffffff), .3))); wall.position.y = .16; wall.castShadow = true; h.add(wall);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(.4, .24, 4), std(th.snow ? 0xffffff : new THREE.Color(col).multiplyScalar(.6))); roof.rotation.y = Math.PI / 4; roof.position.y = .44; roof.castShadow = true; h.add(roof);
        [-.12, .12].forEach(x => { const w = new THREE.Mesh(new THREE.BoxGeometry(.09, .09, .01), std(0xfff2b0, {emissive:0xffd060, emissiveIntensity:1.6})); w.position.set(x, .18, .205); h.add(w); }); }
      return; }
    const mask = cell, on = POWER.has(key), broken = key === BROKEN;
    if (th.old){ segs(mask).forEach(s => { const pts = s.map(p => V(p[0], .165, p[1])); const curve = new THREE.CatmullRomCurve3(pts.length > 2 ? pts : [pts[0], pts[0].clone().lerp(pts[1], .5), pts[1]]);
        const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 30, .036, 10), on ? std(0xff9d1c, {emissive:0xff8a00, emissiveIntensity:.55}) : std(0x23262e, {roughness:.5})); m.castShadow = true; g.add(m); }); return; }
    const Y = .13;
    segs(mask).forEach(s => {
      const pts = s.length > 2 ? s : [s[0], [(s[0][0] + s[1][0]) / 2, (s[0][1] + s[1][1]) / 2], s[1]];
      const base = th.sag && s.length === 2 && (s[1][0] !== 0 || s[1][1] !== 0 || true) ? null : null;
      const centre = new THREE.CatmullRomCurve3(pts.map((p, i) => { const k = i / (pts.length - 1); const y = th.sag ? Y + .3 - .18 * Math.sin(Math.PI * k) : Y; return V(p[0], y, p[1]); }));
      if (th.sag && s.length === 2 && s[1][0] === 0 && s[1][1] === 0){ /* kol: kenardan merkeze */ }
      const N = 60, cols = [BR, BL, YG];
      cols.forEach((mat, wi) => { const wp = []; for (let i = 0; i <= N; i++){ const k = i / N, p = centre.getPointAt(k), t = centre.getTangentAt(k); const side = new THREE.Vector3().crossVectors(t, V(0,1,0)).normalize(); const up = new THREE.Vector3().crossVectors(side, t).normalize(); const a = k * Math.PI * 7 + wi * 2 * Math.PI / 3; wp.push(p.clone().addScaledVector(side, Math.cos(a) * .016).addScaledVector(up, Math.sin(a) * .016)); }
        const wm = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(wp), 120, .0115, 8), on && !broken ? ON(mat.color) : broken ? std(0x7a2a30, {emissive:0xff3b2b, emissiveIntensity:.35}) : mat); wm.castShadow = true; g.add(wm); });
      // bakır uçlar
      [0, 1].forEach(e => { if (e === 1 && s.length === 2 && s[1][0] === 0 && s[1][1] === 0) return; const p = centre.getPointAt(e ? .995 : .005); const cu = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .05, 10), CU); cu.position.copy(p); const t = centre.getTangentAt(e ? .995 : .005); cu.quaternion.setFromUnitVectors(V(0,1,0), t); g.add(cu); });
      if (on && !broken) for (let i = 0; i < 3; i++){ const sp = new THREE.Sprite(pulseM); sp.scale.setScalar(.22); sp.position.copy(centre.getPointAt((i + .3) / 3.2)); g.add(sp); }
      // mekân süsleri
      if (th.deco === 'clip') [.3, .7].forEach(k => { const p = centre.getPointAt(k), t = centre.getTangentAt(k); const cl = new THREE.Mesh(new THREE.TorusGeometry(.04, .009, 6, 12, Math.PI), std(0xdedede, {metalness:.4, roughness:.3})); cl.position.copy(p).setY(Y - .02); cl.rotation.y = Math.atan2(t.x, t.z) + Math.PI / 2; g.add(cl); });
      if (th.deco === 'duct'){ const len = centre.getLength(); const d = new THREE.Mesh(new THREE.TubeGeometry(centre, 30, .055, 4), std(0x30343a, {roughness:.9, transparent:true, opacity:.55})); d.position.y = -.035; g.add(d); }
      if (th.deco === 'tray'){ const tr = new THREE.Mesh(new THREE.TubeGeometry(centre, 30, .07, 4, false), std(0xb9c0c8, {metalness:.8, roughness:.35, side:THREE.DoubleSide, transparent:true, opacity:.85})); tr.position.y = -.04; tr.scale.y = .5; g.add(tr); }
    });
    if ([3,6,12,9,5,10].includes(mask) === false || true){ const hub = new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, .05, 12), std(0x2b2f36, {metalness:.3})); hub.position.y = th.sag ? .43 : .14; if ([7,11,13,14,15].includes(mask)) g.add(hub); }
    if (th.deco === 'pole') [1,2,4,8].forEach(b => { if (mask & b){ const E = {1:[0,-.45], 2:[.45,0], 4:[0,.45], 8:[-.45,0]}[b]; const po = new THREE.Mesh(new THREE.CylinderGeometry(.025, .03, .48, 8), std(0x6b4423)); po.position.set(E[0], .26, E[1]); po.castShadow = true; g.add(po);
        if (th.snow){ const sn = new THREE.Mesh(new THREE.SphereGeometry(.04, 8, 6), std(0xffffff)); sn.position.set(E[0], .51, E[1]); sn.scale.y = .6; g.add(sn); } } });
    if (th.deco === 'duct' && (r + c) % 3 === 0){ const mh = new THREE.Mesh(new THREE.CylinderGeometry(.13, .13, .012, 20), std(0x2a2d31, {metalness:.6, roughness:.5})); mh.position.set(.28, .056, .28); g.add(mh); }
    if (th.deco === 'tray' && (r + c) % 2 === 0){ const st = new THREE.Mesh(new THREE.BoxGeometry(.86, .012, .05), std(0xffd000)); st.position.set(0, .056, .42); g.add(st); }
    if (broken) for (let i = 0; i < 5; i++){ const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, color:0xff5533, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending})); sp.scale.setScalar(.12 + i * .03); sp.position.set(.1 + i * .02, .2 + i * .03, -.05); g.add(sp); }
  }));
  if (th.snow) for (let i = 0; i < 160; i++){ const f = new THREE.Mesh(new THREE.SphereGeometry(.018, 4, 3), std(0xffffff, {emissive:0xffffff, emissiveIntensity:.3})); f.position.set(Math.sin(i * 12.9) * 3.4, .3 + (i * 37 % 100) / 40, Math.cos(i * 7.3) * 3.4); scene.add(f); }
  if (th.night){ const pts = [V(1.6, 4, -2.6), V(1.2, 3, -2.2), V(1.5, 2.2, -2), V(1, 1, -1.6)]; const bolt = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0), 20, .03, 6), new THREE.MeshBasicMaterial({color:0xcfe0ff})); scene.add(bolt); const fl = new THREE.PointLight(0x9fb8ff, 6, 8); fl.position.set(1.2, 2.5, -1.8); scene.add(fl); }
  comp = new EffectComposer(R); comp.addPass(new RenderPass(scene, cam)); comp.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), th.night ? .9 : .45, .4, .85)); comp.addPass(new OutputPass());
}
window.renderAt = t => { build(THEMES[Math.round(t)]); comp.render(); };
window.READY = true;
</script></body></html>
