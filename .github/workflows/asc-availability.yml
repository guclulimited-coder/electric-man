name: App Store ülke erişimi (sahip onayı 6 Kasım 2026)
on:
  push:
    branches: [asc-availability]
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: pip install -q 'PyJWT[crypto]==2.10.1' requests==2.32.3
      - env:
          ASC_KEY_ID: ${{ secrets.EM_ASC_KEY_ID || 'AMWHRWY3U4' }}
          ASC_ISSUER_ID: ${{ secrets.EM_ASC_ISSUER_ID || 'cab75b07-a305-412b-a205-a91b4280d965' }}
          ASC_PRIVATE_KEY: ${{ secrets.EM_ASC_PRIVATE_KEY }}
        run: python scripts/asc-availability.py open && python scripts/asc-availability.py read
