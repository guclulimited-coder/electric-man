name: Giris denetimi (emulator, salt okunur)
# 31 Ekim 2026: Android'de giris sonrasi uygulamaya donus (electricman://signin) Chrome'da engelleniyor mu?
# Canliya hicbir sey yazmaz; uygulama hata ayiklama paketi emulatorde calisir, test sayfalari runner uzerinde.
on:
  push:
    branches: [signin-probe]
    paths: ['.github/workflows/signin-probe.yml', '.github/scripts/signin-probe.sh']
permissions: { contents: write }
concurrency: { group: signin-probe, cancel-in-progress: false }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Oyunu uygulamaya paketle
        run: node scripts/bundle-native.mjs android/app/src/main/assets/www
      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Hata ayiklama APK
        run: gradle -p android assembleDebug --no-daemon -q
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulatorde dene
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/signin-probe.sh
      - name: Ekran goruntulerini dala yaz
        if: always()
        run: |
          [ -d probe ] || exit 0
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add probe && git commit -qm "signin probe shots [skip ci]" && git push -q || true
