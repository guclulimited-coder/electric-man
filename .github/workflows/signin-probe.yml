name: Giris denetimi (emulator, salt okunur)
# 31 Ekim 2026: Android'de giris sonrasi uygulamaya donus (electricman://signin) Chrome'da engelleniyor mu?
# Canliya hicbir sey yazmaz; uygulama hata ayiklama paketi emulatorde calisir, test sayfalari runner uzerinde.
on:
  push:
    branches: [signin-probe]
    paths: ['.github/workflows/signin-probe.yml', '.github/scripts/signin-probe.sh']
permissions: { contents: write }
concurrency: { group: signin-probe, cancel-in-progress: false }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Play surumlerini (AAB) emulator paketine cevir
        run: |
          set -e
          mkdir -p probe-apk && cd probe-apk
          curl -sSL -o bt.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          curl -sSL -o em.aab https://raw.githubusercontent.com/guclulimited-coder/electric-man/builds/ElectricMan-1.0.35-135.aab
          curl -sSL -o eh.aab https://raw.githubusercontent.com/guclulimited-coder/electric-man/hunter-builds/ElectricHunter-1.0.30-130.aab
          ls -la
          keytool -genkeypair -keystore dbg.jks -storepass android -keypass android -alias dbg -dname CN=probe -keyalg RSA -validity 30 >/dev/null 2>&1
          for g in em eh; do java -jar bt.jar build-apks --bundle=$g.aab --output=$g.apks --mode=universal --ks=dbg.jks --ks-pass=pass:android --ks-key-alias=dbg --key-pass=pass:android && unzip -o -q $g.apks universal.apk && mv universal.apk $g.apk; done
          ls -la *.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulatorde dene
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/signin-probe.sh
      - name: Ekran goruntulerini dala yaz
        if: always()
        run: |
          [ -d probe ] || exit 0
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add probe && git commit -qm "signin probe shots [skip ci]" && git push -q || true
