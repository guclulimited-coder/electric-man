name: Download stats (read-only)
on:
  push:
    branches: [stats-downloads]
    paths: ['.github/workflows/stats-downloads.yml', 'scripts/stats_downloads.py']
permissions: { contents: write }
concurrency: { group: stats-downloads, cancel-in-progress: false }
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: stats-downloads }
      - env:
          LABEL: electric-man
          PLAY_SA_JSON: ${{ secrets.NONE_PLAY }}
          API_PRIVATE_KEY: ${{ secrets.EM_ASC_PRIVATE_KEY }}
          ASC_KEY_ID: AMWHRWY3U4
          ASC_ISSUER: cab75b07-a305-412b-a205-a91b4280d965
        run: |
          set -uo pipefail
          python3 -m pip install -q 'PyJWT[crypto]==2.10.1' 'requests==2.32.3' 'google-auth==2.38.0'
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          if [ -n "$API_PRIVATE_KEY" ]; then python3 - "$ASC_KEY_PATH" <<'PY'
          import os, re, sys, textwrap
          raw = os.environ['API_PRIVATE_KEY'].replace('\\n', '\n')
          body = re.sub(r'[^A-Za-z0-9+/=]', '', re.sub(r'-----(BEGIN|END)[A-Z ]*-----', '', raw))
          open(sys.argv[1], 'w').write('-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(body, 64)) + '\n-----END PRIVATE KEY-----\n')
          PY
          fi
          python3 scripts/stats_downloads.py
          rm -f "$ASC_KEY_PATH"
      - run: |
          git -c user.name=Claude -c user.email=noreply@anthropic.com add stats
          git -c user.name=Claude -c user.email=noreply@anthropic.com commit -m "stats results [skip ci]" && git push || true
