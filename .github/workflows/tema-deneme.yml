name: Tema denemesi (yayın yok)
on: { push: { branches: [tema-deneme] } }
permissions: { contents: write }
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd tema && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - run: cd public && (python3 -m http.server 8000 >/dev/null 2>&1 &) && sleep 1
      - run: node tema/shot.mjs
        working-directory: .
        env: { NODE_PATH: tema/node_modules }
      - if: always()
        run: |
          cd tema/out || exit 0
          git init -q -b tema-out && git config user.name ci && git config user.email ci@tusneldax.com && git add . && git commit -qm "tema $GITHUB_RUN_ID"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tema-out
