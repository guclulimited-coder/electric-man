name: iOS build
on:
  push:
    branches: [main]
    paths: ['ios/**', 'public/**', '!public/hunter/**', 'native/**', 'scripts/bundle-native.mjs', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      release30:
        description: 'Omer-approved existing Electric Man build30 upload/submission only'
        type: choice
        default: none
        options: [none, upload-and-submit, submit-only, diagnose-only]
      sign_only:
        description: 'Export existing build 30 archive only; never upload or revoke certificates'
        type: boolean
        default: false
      enable_apple:
        description: 'Enable requested App ID Apple login capability; requires apple_audit, never uploads'
        type: boolean
        default: false
      apple_audit:
        description: 'Read-only App ID capability audit; key stays in process memory, no files or signing'
        type: boolean
        default: false
      archive_only:
        description: 'Build unsigned device archive only; requires ipad_check=true and upload=false'
        type: boolean
        default: false
      ipad_check:
        description: 'Unsigned iPad build 30 UI check only (no signing, credentials or upload)'
        type: boolean
        default: false
      upload:
        description: 'Sign and upload to App Store Connect (TestFlight)'
        type: boolean
        default: false
permissions:
  contents: write
env:
  TEAM_ID: YMAU5R6AA4
  BUNDLE_ID: com.tusneldax.electricman
  PROFILE_NAME: Electric Man App Store
jobs:
  build:
    # macOS minutes are expensive: only run when an upload is requested
    if: ${{ (!inputs.release30 || inputs.release30 == 'none') && !inputs.sign_only && !inputs.ipad_check && !inputs.apple_audit && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios-upload]') || contains(github.event.head_commit.message, '[ios-check]')) }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: eh-ios-cert
          path: prev-cert
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle the game into the app
        run: node scripts/bundle-native.mjs ios/ElectricMan/www
      - name: Xcode 26 and project
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version
          brew install xcodegen >/dev/null
          cd ios && xcodegen generate
          grep -E '^EM_.*_IOS=.+' ../native/ads.env | sed 's/^/ /' | tr -d '\n' > ../ads-settings.txt || true
          echo "AD_SETTINGS=$(cat ../ads-settings.txt)" >> "$GITHUB_ENV"
      - name: Compile (simulator, official test ads)
        run: |
          set +e
          xcodebuild -project ios/ElectricMan.xcodeproj -scheme ElectricMan -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build > build-sim.log 2>&1
          code=$?
          # surface results as annotations (readable through the API)
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build-sim.log | sort -u | head -40 | while read -r l; do echo "::warning::$l"; done
          echo "::notice::$(xcodebuild -version | head -1) · simulator build exit $code"
          exit $code
      - name: Archive with Xcode cloud signing and upload to App Store Connect
        if: (github.event_name == 'workflow_dispatch' && inputs.upload) || contains(github.event.head_commit.message, '[ios-upload]')
        env:
          API_PRIVATE_KEY: ${{ secrets.EM_ASC_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.EM_ASC_KEY_ID || 'AMWHRWY3U4' }}
          ISSUER: ${{ secrets.EM_ASC_ISSUER_ID || 'cab75b07-a305-412b-a205-a91b4280d965' }}
        run: |
          set -euo pipefail
          if [ -z "$API_PRIVATE_KEY" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ]; then echo "::error::EM_ASC_PRIVATE_KEY secret is missing"; exit 1; fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          # normalise the pasted key (lost line breaks, literal \n, spaces) back into a valid PEM
          python3 - "$KEY" <<'PY'
          import os, re, sys, textwrap
          raw = os.environ['API_PRIVATE_KEY'].replace('\\n', '\n')
          body = re.sub(r'-----(BEGIN|END)[A-Z ]*-----', '', raw)
          body = re.sub(r'[^A-Za-z0-9+/=]', '', body)
          if len(body) < 100: print('::error::EM_ASC_PRIVATE_KEY looks incomplete (' + str(len(body)) + ' base64 chars)'); sys.exit(1)
          open(sys.argv[1], 'w').write('-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(body, 64)) + '\n-----END PRIVATE KEY-----\n')
          print('::notice::API key normalised: ' + str(len(body)) + ' base64 chars, lines in secret: ' + str(raw.count(chr(10)) + 1))
          PY
          chmod 600 "$KEY"
          # Signing without stored certificates: create a temporary Apple Distribution certificate + App Store profile
          # through the App Store Connect API, sign and upload. The certificate is revoked only when the upload fails:
          # revoking it after a successful upload makes Apple mark that build "Invalid Binary".
          python3 -m venv "$RUNNER_TEMP/asc" && "$RUNNER_TEMP/asc/bin/pip" -q install 'PyJWT[crypto]==2.10.1'
          "$RUNNER_TEMP/asc/bin/python" - "$KEY" <<'PY'
          import base64, json, os, pathlib, plistlib, secrets, subprocess, sys, time, traceback, urllib.request, urllib.error, jwt
          def report(t, v, tb):
              print('::error::signing script: ' + ''.join(traceback.format_exception(t, v, tb))[-600:].replace(chr(10), ' | '))
          sys.excepthook = report
          env = os.environ; temp = pathlib.Path(env['RUNNER_TEMP']); key = open(sys.argv[1]).read()
          def api(method, path, body=None):
              tok = jwt.encode({'iss': env['ISSUER'], 'iat': int(time.time()), 'exp': int(time.time()) + 600, 'aud': 'appstoreconnect-v1'}, key, algorithm='ES256', headers={'kid': env['KEY_ID'], 'typ': 'JWT'})
              req = urllib.request.Request('https://api.appstoreconnect.apple.com' + path, method=method, data=json.dumps(body).encode() if body else None, headers={'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: return json.load(r) if r.status != 204 else {}
              except urllib.error.HTTPError as e:
                  msg = e.read().decode()[:400]; print('::error::' + method + ' ' + path + ' -> ' + str(e.code) + ' ' + msg.replace(chr(10), ' ')); raise
          bid_name = env['BUNDLE_ID']
          found = [b for b in api('GET', '/v1/bundleIds?filter[identifier]=' + bid_name)['data'] if b['attributes']['identifier'] == bid_name]
          bid = found[0] if found else api('POST', '/v1/bundleIds', {'data': {'type': 'bundleIds', 'attributes': {'identifier': bid_name, 'name': 'Electric Man', 'platform': 'IOS'}}})['data']
          # Sign in with Apple (native, 24 Oct 2026): the App ID needs the capability so the App Store profile carries the entitlement
          caps = api('GET', '/v1/bundleIds/' + bid['id'] + '/bundleIdCapabilities')['data']
          if any(c['attributes'].get('capabilityType') == 'APPLE_ID_AUTH' for c in caps): print('::notice::Sign in with Apple already enabled on ' + bid_name)
          else:
              api('POST', '/v1/bundleIdCapabilities', {'data': {'type': 'bundleIdCapabilities', 'attributes': {'capabilityType': 'APPLE_ID_AUTH',
                  'settings': [{'key': 'APPLE_ID_AUTH_APP_CONSENT', 'options': [{'key': 'PRIMARY_APP_CONSENT'}]}]}, 'relationships': {'bundleId': {'data': {'type': 'bundleIds', 'id': bid['id']}}}}})
              print('::notice::enabled Sign in with Apple on ' + bid_name)
          # temporary certificate
          k = temp / 'em.key'; csr = temp / 'em.csr'
          subprocess.run(['openssl', 'req', '-new', '-newkey', 'rsa:2048', '-nodes', '-keyout', str(k), '-out', str(csr), '-subj', '/CN=Electric Man CI/O=TusneldaX/C=TR'], check=True, capture_output=True)
          csr_b64 = ''.join(l for l in csr.read_text().splitlines() if not l.startswith('-----'))
          cert = None; sign_id = 'Apple Distribution'
          for ctype, ident in [('DISTRIBUTION', 'Apple Distribution'), ('IOS_DISTRIBUTION', 'iPhone Distribution')]:
              try:
                  cert = api('POST', '/v1/certificates', {'data': {'type': 'certificates', 'attributes': {'certificateType': ctype, 'csrContent': csr_b64}}})['data']; sign_id = ident; break
              except urllib.error.HTTPError as e:
                  if e.code != 409: raise
          if not cert:
              # both slots taken: revoke the certificate of the previous Electric Man upload (recorded on the eh-ios-cert branch;
              # 3S37L2JAP7 = build 29, created by this workflow on 6 Oct 2026). That older build is superseded by this one.
              prev = pathlib.Path('prev-cert/em-ios-cert.txt'); pid = prev.read_text().strip() if prev.exists() else '3S37L2JAP7'
              try: api('DELETE', '/v1/certificates/' + pid); print('::warning::revoked the previous Electric Man CI certificate ' + pid + ' (its build is replaced by this one)')
              except Exception as e: print('::warning::could not revoke ' + pid + ': ' + str(e))
              time.sleep(5)
              for ctype, ident in [('DISTRIBUTION', 'Apple Distribution'), ('IOS_DISTRIBUTION', 'iPhone Distribution')]:
                  try:
                      cert = api('POST', '/v1/certificates', {'data': {'type': 'certificates', 'attributes': {'certificateType': ctype, 'csrContent': csr_b64}}})['data']; sign_id = ident; break
                  except urllib.error.HTTPError as e:
                      if e.code != 409: raise
          if not cert: print('::error::Apple distribution certificate limit reached (both types)'); sys.exit(1)
          (temp / 'em-sign-id').write_text(sign_id)
          (temp / 'em-cert-id').write_text(cert['id'])
          der = temp / 'em.cer'; der.write_bytes(base64.b64decode(cert['attributes']['certificateContent']))
          pem = temp / 'em.pem'; subprocess.run(['openssl', 'x509', '-inform', 'DER', '-in', str(der), '-out', str(pem)], check=True)
          pw = secrets.token_urlsafe(24); p12 = temp / 'em.p12'
          r = subprocess.run(['openssl', 'pkcs12', '-export', '-legacy', '-inkey', str(k), '-in', str(pem), '-out', str(p12), '-passout', 'pass:' + pw], capture_output=True, text=True)
          if r.returncode:  # LibreSSL has no -legacy and already writes the classic format
              r = subprocess.run(['openssl', 'pkcs12', '-export', '-inkey', str(k), '-in', str(pem), '-out', str(p12), '-passout', 'pass:' + pw], capture_output=True, text=True)
          if r.returncode: print('::error::pkcs12 export failed: ' + r.stderr[:300].replace(chr(10), ' ')); sys.exit(1)
          kc = str(temp / 'em.keychain-db'); kpw = secrets.token_urlsafe(24)
          for args in [['create-keychain', '-p', kpw, kc], ['set-keychain-settings', '-lut', '21600', kc], ['unlock-keychain', '-p', kpw, kc],
                       ['import', str(p12), '-P', pw, '-A', '-t', 'cert', '-f', 'pkcs12', '-k', kc], ['set-key-partition-list', '-S', 'apple-tool:,apple:,codesign:', '-s', '-k', kpw, kc],
                       ['list-keychains', '-d', 'user', '-s', kc, 'login.keychain-db']]:
              r = subprocess.run(['security'] + args, capture_output=True, text=True)
              if r.returncode: print('::error::security ' + args[0] + ': ' + r.stderr[:200]); sys.exit(1)
          # App Store profile for this certificate
          name = 'Electric Man CI ' + time.strftime('%Y%m%d%H%M%S')
          prof = api('POST', '/v1/profiles', {'data': {'type': 'profiles', 'attributes': {'name': name, 'profileType': 'IOS_APP_STORE'},
                     'relationships': {'bundleId': {'data': {'type': 'bundleIds', 'id': bid['id']}}, 'certificates': {'data': [{'type': 'certificates', 'id': cert['id']}]}}}})['data']
          (temp / 'em-profile-id').write_text(prof['id'])
          pf = temp / 'em.mobileprovision'; pf.write_bytes(base64.b64decode(prof['attributes']['profileContent']))
          info = plistlib.loads(subprocess.check_output(['security', 'cms', '-D', '-i', str(pf)]))
          for d in [pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles', pathlib.Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles']:
              d.mkdir(parents=True, exist_ok=True); (d / (info['UUID'] + '.mobileprovision')).write_bytes(pf.read_bytes())
          pathlib.Path('ExportOptions.plist').write_bytes(plistlib.dumps({'method': 'app-store-connect', 'destination': 'upload', 'signingStyle': 'manual', 'teamID': env['TEAM_ID'],
              'signingCertificate': sign_id, 'provisioningProfiles': {bid_name: info['Name']}, 'manageAppVersionAndBuildNumber': False, 'uploadSymbols': True}))
          (temp / 'em-profile-name').write_text(info['Name'])
          apps = api('GET', '/v1/apps?filter[bundleId]=' + bid_name)['data']
          print('::notice::temporary distribution certificate ' + cert['id'] + ', profile ' + info['Name'] + ', app record ' + (apps[0]['id'] if apps else 'MISSING'))
          PY
          PROFILE_NAME_CI=$(cat "$RUNNER_TEMP/em-profile-name")
          AUTH=(-authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project ios/ElectricMan.xcodeproj -scheme ElectricMan -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/ElectricMan.xcarchive CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$(cat $RUNNER_TEMP/em-sign-id)" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME_CI" DEVELOPMENT_TEAM="$TEAM_ID" OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/em.keychain-db" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" $AD_SETTINGS archive > archive.log 2>&1 \
            || { set +e; { grep -E "error:|Signing|signing" archive.log | sort -u | head -20; tail -15 archive.log; } | while read -r l; do echo "::error::$l"; done; exit 1; }
          xcodebuild -exportArchive -archivePath build/ElectricMan.xcarchive -exportPath release -exportOptionsPlist ExportOptions.plist "${AUTH[@]}" > export.log 2>&1 \
            || { set +e; tail -25 export.log | while read -r l; do echo "::error::$l"; done; exit 1; }
          touch "$RUNNER_TEMP/em-uploaded"
          echo "::notice::Uploaded build $GITHUB_RUN_NUMBER to App Store Connect"
          # remember which certificate this build was signed with, so the next upload can free its slot
          cd "$GITHUB_WORKSPACE/prev-cert" && cp "$RUNNER_TEMP/em-cert-id" em-ios-cert.txt && git config user.name ci && git config user.email ci@tusneldax.com \
            && git add em-ios-cert.txt && git commit -qm "Electric Man iOS build $GITHUB_RUN_NUMBER certificate" && git push -q || echo "::warning::could not record the certificate id"
      - name: Clean up signing files (revoke the certificate only if nothing was uploaded)
        if: always()
        env:
          KEY_ID: ${{ secrets.EM_ASC_KEY_ID || 'AMWHRWY3U4' }}
          ISSUER: ${{ secrets.EM_ASC_ISSUER_ID || 'cab75b07-a305-412b-a205-a91b4280d965' }}
        run: |
          KEY=$(ls "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8 2>/dev/null | head -1 || true)
          if [ -n "$KEY" ] && [ -x "$RUNNER_TEMP/asc/bin/python" ]; then
            "$RUNNER_TEMP/asc/bin/python" - "$KEY" <<'PY' || true
          import os, sys, time, pathlib, urllib.request, jwt
          env = os.environ; temp = pathlib.Path(env['RUNNER_TEMP']); key = open(sys.argv[1]).read()
          tok = jwt.encode({'iss': env['ISSUER'], 'iat': int(time.time()), 'exp': int(time.time()) + 600, 'aud': 'appstoreconnect-v1'}, key, algorithm='ES256', headers={'kid': env['KEY_ID'], 'typ': 'JWT'})
          kinds = [('profiles', 'em-profile-id')] + ([] if (temp / 'em-uploaded').exists() else [('certificates', 'em-cert-id')])
          if (temp / 'em-uploaded').exists() and (temp / 'em-cert-id').exists(): print('::notice::kept distribution certificate ' + (temp / 'em-cert-id').read_text().strip() + ' (the uploaded build depends on it)')
          for kind, f in kinds:
              p = temp / f
              if p.exists():
                  try:
                      urllib.request.urlopen(urllib.request.Request('https://api.appstoreconnect.apple.com/v1/' + kind + '/' + p.read_text().strip(), method='DELETE', headers={'Authorization': 'Bearer ' + tok}), timeout=60)
                      print('::notice::removed temporary ' + kind[:-1])
                  except Exception as e: print('::warning::could not remove temporary ' + kind[:-1] + ': ' + str(e))
          PY
          fi
          security delete-keychain "$RUNNER_TEMP/em.keychain-db" 2>/dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8 "$RUNNER_TEMP"/em.*

  ipad-unsigned-check:
    if: ${{ (!inputs.release30 || inputs.release30 == 'none') && github.event_name == 'workflow_dispatch' && inputs.ipad_check && !inputs.sign_only && !inputs.apple_audit && !inputs.upload }}
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ios/
            /src/
            /scripts/
            /tests/
            /package.json
            /schema.sql
            /public/_worker.js
            /public/index.html
            /public/engine.js
            /public/serhat.txt
            /public/zeynep.txt
            /public/icon-192.png
            /public/icon-512.png
            /public/i18n/
            /public/avatars/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic API and native contracts
        run: |
          node scripts/build.mjs
          node tests/apple-login.test.mjs
          node tests/apple-native-contract.test.mjs
      - name: Unsigned iPad simulator build and captures
        timeout-minutes: 10
        run: |
          if [ "${{ inputs.archive_only }}" = true ]; then
            bash scripts/archive-ios30.sh
          else
            bash scripts/check-ipad30.sh
          fi
      - name: Preserve simulator evidence (never upload to Apple)
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electric-man-build30-ipad-unsigned
          path: evidence/ipad30/
          retention-days: 3
          if-no-files-found: warn

  apple-capability-audit:
    if: ${{ (!inputs.release30 || inputs.release30 == 'none') && github.event_name == 'workflow_dispatch' && inputs.apple_audit && !inputs.sign_only && !inputs.upload }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/audit-apple-capability.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check or enable requested App ID capability (no key files, no certificate operations)
        env:
          APPLE_ENABLE_CAPABILITY: ${{ inputs.enable_apple }}
          APPLE_AUDIT_PRIVATE_KEY: ${{ secrets.EM_ASC_PRIVATE_KEY }}
          APPLE_AUDIT_KEY_ID: ${{ secrets.EM_ASC_KEY_ID || '7368ZSQD95' }}
          APPLE_AUDIT_ISSUER: ${{ secrets.EM_ASC_ISSUER_ID || 'cab75b07-a305-412b-a205-a91b4280d965' }}
        run: node scripts/audit-apple-capability.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
          name: electric-man-apple-capability-audit
          path: evidence/apple-capability.json
          retention-days: 3

  export-build30-only:
    if: ${{ (!inputs.release30 || inputs.release30 == 'none') && github.event_name == 'workflow_dispatch' && inputs.sign_only && !inputs.upload && !inputs.ipad_check && !inputs.apple_audit }}
    runs-on: macos-15
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/export-ios30.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40294040637
          name: electric-man-build30-ipad-unsigned
          path: archive-input
      - name: Unpack existing unsigned archive
        run: |
          mkdir build30
          unzip -q archive-input/ElectricMan-build30-unsigned-archive.zip -d build30
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
      - name: Export only, never upload
        timeout-minutes: 5
        env:
          ASC_PRIVATE_KEY: ${{ secrets.EM_ASC_PRIVATE_KEY }}
        run: python3 scripts/export-ios30.py
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
          name: electric-man-build30-export-only
          path: |
            evidence/sign30/*.ipa
            evidence/sign30/result.json
          retention-days: 3
          if-no-files-found: warn

  upload-approved30:
    if: ${{ github.event_name == 'workflow_dispatch' && ((inputs.release30 == 'upload-and-submit' && inputs.upload) || inputs.release30 == 'diagnose-only') }}
    runs-on: macos-15
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/upload-approved30.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40327446648
          name: electric-man-build30-export-only
          path: approved-input
      - name: Upload verified build30 only
        timeout-minutes: 5
        env:
          ASC_PRIVATE_KEY: ${{ secrets.EM_ASC_PRIVATE_KEY }}
          DIAG_ONLY: ${{ inputs.release30 == 'diagnose-only' }}
        run: python3 scripts/upload-approved30.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electric-man-approved-upload30
          path: evidence/upload30/result.json
          retention-days: 3

  submit-approved30:
    needs: upload-approved30
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.upload && (inputs.release30 == 'submit-only' || (inputs.release30 == 'upload-and-submit' && needs.upload-approved30.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/submit-approved30.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Attach processed build30 and resubmit Electric Man 1.0
        env:
          ASC_PRIVATE_KEY: ${{ secrets.EM_ASC_PRIVATE_KEY }}
        run: node scripts/submit-approved30.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electric-man-approved-submit30
          path: evidence/submit30/result.json
          retention-days: 3
