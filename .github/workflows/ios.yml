name: iOS build
on:
  push:
    branches: [main]
    paths: ['ios/**', 'public/**', 'native/**', 'scripts/bundle-native.mjs', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      upload:
        description: 'Sign and upload to App Store Connect (TestFlight)'
        type: boolean
        default: false
permissions:
  contents: read
env:
  TEAM_ID: YMAU5R6AA4
  BUNDLE_ID: com.tusneldax.electricman
  PROFILE_NAME: Electric Man App Store
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle the game into the app
        run: node scripts/bundle-native.mjs ios/ElectricMan/www
      - name: Xcode 26 and project
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version
          brew install xcodegen >/dev/null
          cd ios && xcodegen generate
          grep -E '^EM_.*_IOS=.+' ../native/ads.env | sed 's/^/ /' | tr -d '\n' > ../ads-settings.txt || true
          echo "AD_SETTINGS=$(cat ../ads-settings.txt)" >> "$GITHUB_ENV"
      - name: Compile (simulator, official test ads)
        run: |
          set +e
          xcodebuild -project ios/ElectricMan.xcodeproj -scheme ElectricMan -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build > build-sim.log 2>&1
          code=$?
          # surface results as annotations (readable through the API)
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build-sim.log | sort -u | head -40 | while read -r l; do echo "::warning::$l"; done
          echo "::notice::$(xcodebuild -version | head -1) · simulator build exit $code"
          exit $code
      - name: Archive with Xcode cloud signing and upload to App Store Connect
        if: (github.event_name == 'workflow_dispatch' && inputs.upload) || contains(github.event.head_commit.message, '[ios-upload]')
        env:
          API_PRIVATE_KEY: ${{ secrets.EM_ASC_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.EM_ASC_KEY_ID || 'AMWHRWY3U4' }}
          ISSUER: ${{ secrets.EM_ASC_ISSUER_ID || 'cab75b07-a305-412b-a205-a91b4280d965' }}
        run: |
          set -euo pipefail
          if [ -z "$API_PRIVATE_KEY" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ]; then echo "::error::EM_ASC_PRIVATE_KEY secret is missing"; exit 1; fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          # normalise the pasted key (lost line breaks, literal \n, spaces) back into a valid PEM
          python3 - "$KEY" <<'PY'
          import os, re, sys, textwrap
          raw = os.environ['API_PRIVATE_KEY'].replace('\\n', '\n')
          body = re.sub(r'-----(BEGIN|END)[A-Z ]*-----', '', raw)
          body = re.sub(r'[^A-Za-z0-9+/=]', '', body)
          if len(body) < 100: print('::error::EM_ASC_PRIVATE_KEY looks incomplete (' + str(len(body)) + ' base64 chars)'); sys.exit(1)
          open(sys.argv[1], 'w').write('-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(body, 64)) + '\n-----END PRIVATE KEY-----\n')
          print('::notice::API key normalised: ' + str(len(body)) + ' base64 chars, lines in secret: ' + str(raw.count(chr(10)) + 1))
          PY
          chmod 600 "$KEY"
          # make sure the bundle id exists in the developer account (needed for the App Store Connect app record)
          python3 -m venv "$RUNNER_TEMP/asc" && "$RUNNER_TEMP/asc/bin/pip" -q install 'PyJWT[crypto]==2.10.1'
          "$RUNNER_TEMP/asc/bin/python" - "$KEY" <<'PY'
          import json, os, sys, time, urllib.request, urllib.error, jwt
          key = open(sys.argv[1]).read()
          tok = jwt.encode({'iss': os.environ['ISSUER'], 'iat': int(time.time()), 'exp': int(time.time()) + 600, 'aud': 'appstoreconnect-v1'}, key, algorithm='ES256', headers={'kid': os.environ['KEY_ID'], 'typ': 'JWT'})
          def api(method, path, body=None):
              req = urllib.request.Request('https://api.appstoreconnect.apple.com' + path, method=method, data=json.dumps(body).encode() if body else None, headers={'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as r: return json.load(r)
          bid = os.environ['BUNDLE_ID']
          found = [b for b in api('GET', '/v1/bundleIds?filter[identifier]=' + bid)['data'] if b['attributes']['identifier'] == bid]
          if found: print('::notice::bundle id registered: ' + bid)
          else:
              api('POST', '/v1/bundleIds', {'data': {'type': 'bundleIds', 'attributes': {'identifier': bid, 'name': 'Electric Man', 'platform': 'IOS'}}})
              print('::notice::bundle id created: ' + bid)
          apps = api('GET', '/v1/apps?filter[bundleId]=' + bid)['data']
          print('::notice::App Store Connect app record: ' + (apps[0]['id'] + ' ' + apps[0]['attributes']['name'] if apps else 'MISSING (create it in App Store Connect)'))
          PY
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project ios/ElectricMan.xcodeproj -scheme ElectricMan -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/ElectricMan.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" $AD_SETTINGS "${AUTH[@]}" archive > archive.log 2>&1 \
            || { grep -E "error:" archive.log | sort -u | head -30 | while read -r l; do echo "::error::$l"; done; exit 1; }
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" -c "Add :destination string upload" -c "Add :signingStyle string automatic" \
            -c "Add :teamID string $TEAM_ID" -c "Add :manageAppVersionAndBuildNumber bool false" -c "Add :uploadSymbols bool true" ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/ElectricMan.xcarchive -exportPath release -exportOptionsPlist ExportOptions.plist "${AUTH[@]}" > export.log 2>&1 \
            || { grep -iE "error" export.log | sort -u | head -20 | while read -r l; do echo "::error::$l"; done; exit 1; }
          echo "::notice::Uploaded build $GITHUB_RUN_NUMBER to App Store Connect"
      - name: Clean up signing files
        if: always()
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8
