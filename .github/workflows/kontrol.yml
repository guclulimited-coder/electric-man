name: Canli kontrol
on: push
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - run: |
          u=https://electricman.tusneldax.com/hunter/index.html
          echo "EH_ACILIS $(curl -sL -m 20 "$u?x=$RANDOM" | grep -c 'launchAd' || true)"
          for b in electricman electrichunter; do for c in tr us; do
            echo "IOS $b $c $(curl -s -m 20 "https://itunes.apple.com/lookup?bundleId=com.tusneldax.$b&country=$c" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['resultCount'],[(r.get('version'),r.get('currentVersionReleaseDate')) for r in d['results']])" || true)"
          done; done
