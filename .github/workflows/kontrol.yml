name: Canli kontrol
on: push
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q pyjwt cryptography
      - env:
          K: ${{ secrets.EM_ASC_PRIVATE_KEY }}
          KID: ${{ secrets.EM_ASC_KEY_ID || 'AMWHRWY3U4' }}
          ISS: ${{ secrets.EM_ASC_ISSUER_ID || 'cab75b07-a305-412b-a205-a91b4280d965' }}
        run: python3 durum.py 2>&1 | grep -v -i key || true
