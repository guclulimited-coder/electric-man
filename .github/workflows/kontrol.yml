name: Canli kontrol
on: push
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - run: |
          u=https://electricman.tusneldax.com/hunter/index.html
          echo "EH_FILM $(curl -sL -m 20 "$u?x=$RANDOM" | grep -c 'giriş filmini atla' || true)"
          echo "EH_TG $(curl -sL -m 20 "$u?x=$RANDOM" | grep -c 'tg=1' || true)"
          echo "EM_PORTAL $(curl -sL -m 20 "https://electricman.tusneldax.com/portal.js?x=$RANDOM" | grep -c 'gamedistribution' || true)"
