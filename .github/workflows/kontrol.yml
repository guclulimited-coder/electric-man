name: Canli kontrol
on: push
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://tusneldax.com/api/bus-rush/config https://tusneldax.com/api/bus-rush/me https://tusneldax.com/bus-rush/play https://tusneldax.com/ https://bus-rush-staging-20261003.guclu-limited.workers.dev/api/bus-rush/config; do
            echo "### $u"; curl -s -m 20 -o /tmp/b -w "HTTP %{http_code}\n" -H "Origin: https://tusneldax.com" "$u"; head -c 600 /tmp/b | sed 's/[A-Za-z0-9_-]\{40,\}/<uzun>/g'; echo; done
          curl -s -m 20 https://tusneldax.com/ | grep -o -E 'AnındaUsta|TSNX ödül[^<]{0,40}' | sort | uniq -c
