name: HizirUsta Android build
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Play versionCode (empty: 100 + run number)'
        required: false
      version_name:
        description: 'versionName (empty: 1.0.<run number>)'
        required: false
  push:
    branches: [main]
    paths: ['hizirusta-app/android/**', 'hizirusta-app/www/**', 'hizirusta-app/ads.env', '.github/workflows/hizirusta-android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Uygulama sayfalarını pakete koy
        run: mkdir -p hizirusta-app/android/app/src/main/assets/www && cp hizirusta-app/www/*.html hizirusta-app/www/*.mjs hizirusta-app/android/app/src/main/assets/www/
      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Version
        run: |
          VC="${{ inputs.version_code }}"; VN="${{ inputs.version_name }}"
          [[ "$VC" =~ ^[0-9]{1,9}$ ]] || VC=$((GITHUB_RUN_NUMBER))
          [[ "$VN" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || VN="1.0.$GITHUB_RUN_NUMBER"
          echo "EM_VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "EM_VERSION_NAME=$VN" >> "$GITHUB_ENV"
          grep -E '^HU_.*=.+' hizirusta-app/ads.env >> "$GITHUB_ENV" || true
      - name: Debug APK (official test ads)
        run: |
          set +e
          gradle -p hizirusta-app/android assembleDebug --no-daemon > build.log 2>&1; code=$?
          grep -E "^e: |error:|FAILURE|What went wrong|BUILD (SUCCESSFUL|FAILED)" -A2 build.log | head -40 | while read -r l; do echo "::warning::$l"; done
          exit $code
      - name: Signed release bundle
        env:
          KEYSTORE_B64: ${{ secrets.EM_ANDROID_KEYSTORE_B64 }}
          EM_KEYSTORE_PASSWORD: ${{ secrets.EM_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No upload key secret yet; skipping release bundle."; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          EM_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" gradle -p hizirusta-app/android bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: HizirUsta-debug-apk
          path: hizirusta-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: HizirUsta-release-aab
          path: hizirusta-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30
      - name: Keep the release bundle on the builds branch (artifact storage is not reachable from every tool)
        if: hashFiles('hizirusta-app/android/app/build/outputs/bundle/release/*.aab') != ''
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/b" && cp hizirusta-app/android/app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/b/HizirUsta-$EM_VERSION_NAME-$EM_VERSION_CODE.aab" && cp hizirusta-app/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/b/HizirUsta-deneme-$EM_VERSION_NAME.apk"
          cd "$RUNNER_TEMP/b"
          git init -q -b hizirusta-builds && git config user.name "github-actions[bot]" && git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "HizirUsta Android release bundle $EM_VERSION_NAME ($EM_VERSION_CODE)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" hizirusta-builds
