<style>
/* Layout: one-screen phone game — header, 3D Electric Man + speech bubble, stats, 3D board canvas, tool bar.
   Deliberately single (sunny day) theme. */
:root{
  color-scheme: light;
  --sky-top:#6ec6ff; --sky-mid:#b9e6ff; --hill:#bfe8a8;
  --panel:rgba(255,255,255,.72); --panel-solid:#ffffff; --line:rgba(30,60,110,.14);
  --volt:#ffc928; --volt-d:#d99a00;
  --ink:#16304f; --ink-soft:#4f6a8a; --btn:#2f6fe8; --btn-d:#1f4fb0;
  --f-display:"Bungee", "Arial Black", system-ui, sans-serif;
  --f-body:"Rubik", system-ui, -apple-system, sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky-mid);color:var(--ink);font-family:var(--f-body);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:
    radial-gradient(60px 22px at 18% 9%, rgba(255,255,255,.9), transparent 70%),
    radial-gradient(80px 26px at 78% 15%, rgba(255,255,255,.85), transparent 70%),
    radial-gradient(70px 24px at 55% 6%, rgba(255,255,255,.7), transparent 70%),
    radial-gradient(160% 60% at 50% 115%, var(--hill) 0 42%, transparent 43%),
    linear-gradient(var(--sky-top), var(--sky-mid) 55%, #d9f3ff)}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px 0}
.brand{font-family:var(--f-display);font-size:15px;white-space:nowrap;letter-spacing:.04em;line-height:1;min-width:0;color:#1f4fb0;text-shadow:0 2px 0 #fff}
.brand small{display:block;font-family:var(--f-body);font-weight:700;font-size:10.5px;letter-spacing:.1em;color:#1f4f8a;text-shadow:none;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:5px 10px 5px 6px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:0 1px 0 var(--line)}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1a8,var(--volt) 45%,#e0a50c);box-shadow:inset 0 0 0 1.5px #c58f08;display:inline-grid;place-items:center;flex:0 0 auto}
.coin svg{width:11px;height:11px;fill:#7a5200}
.iconbtn{appearance:none;border:0;background:var(--panel);color:var(--ink);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;box-shadow:0 1px 0 var(--line)}
.iconbtn:focus-visible,.tool:focus-visible,.btn:focus-visible,.node:focus-visible{outline:2px solid var(--btn);outline-offset:2px}

.hero{display:flex;align-items:center;gap:6px;padding:0 16px 0 6px;height:118px}
#heroCanvas{width:104px;height:118px;flex:0 0 auto;display:block}
.bubble{position:relative;flex:1;min-width:0;background:#fff;color:var(--ink);border-radius:14px;padding:9px 12px;font-weight:600;font-size:13.5px;line-height:1.32;min-height:40px;display:flex;align-items:center;box-shadow:0 2px 0 var(--line)}
.bubble::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.bubble.pulse{animation:bub .3s ease-out}
@keyframes bub{0%{transform:scale(.96)}100%{transform:scale(1)}}

.status{display:flex;gap:10px;padding:2px 16px 0}
.stat{flex:1;min-width:0;background:var(--panel);border-radius:12px;padding:6px 12px;box-shadow:0 1px 0 var(--line)}
.stat .lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase}
.stat .val{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;margin-top:1px}
.stat .val small{font-size:13px;color:var(--ink-soft);font-weight:600}
.bar{height:5px;border-radius:3px;background:rgba(22,48,79,.12);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--volt);border-radius:3px;transition:width .25s}
.stat.warn .val{color:#d93a2b}

.boardwrap{flex:1;min-height:0;position:relative}
#boardCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-soft);font-weight:600;text-align:center;padding:0 24px}

.tools{display:flex;justify-content:center;gap:20px;padding:4px 16px 12px}
.tool{appearance:none;border:0;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;font:inherit;color:var(--ink);font-size:11px;font-weight:700;min-width:64px}
.tool .ico{width:52px;height:52px;border-radius:50%;background:var(--btn);box-shadow:inset 0 -4px 0 var(--btn-d),0 2px 6px rgba(31,79,176,.25);display:grid;place-items:center}
.tool .ico svg{width:28px;height:28px}
.tool[disabled]{opacity:.45;cursor:default}
.tool .badge{position:absolute;top:-2px;right:0;background:#e5484d;color:#fff;border-radius:999px;font-size:11px;font-weight:800;min-width:20px;height:20px;display:flex;align-items:center;gap:2px;justify-content:center;padding:0 5px;border:2px solid #fff}
.tool .badge .coin{width:13px;height:13px}.tool .badge .coin svg{width:8px;height:8px}

.modal{position:absolute;inset:0;background:rgba(22,48,79,.45);display:grid;place-items:center;z-index:30;padding:16px}
.card{background:#fff;border-radius:18px;padding:22px 20px 18px;width:min(320px,100%);text-align:center;box-shadow:0 14px 34px rgba(22,48,79,.3)}
.card h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 8px;text-wrap:balance;color:var(--ink)}
.card p{margin:0 0 16px;color:var(--ink-soft);font-size:14px;line-height:1.45}
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0 10px}
.card .btns{display:flex;flex-direction:column;gap:8px}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:15px;padding:12px;border-radius:12px;background:var(--btn);color:#fff;box-shadow:inset 0 -4px 0 var(--btn-d)}
.btn.alt{background:var(--volt);color:#3a2c00;box-shadow:inset 0 -4px 0 var(--volt-d)}
.btn[disabled]{opacity:.45;cursor:default}

.map{position:absolute;inset:0;z-index:26;background:linear-gradient(var(--sky-top),var(--sky-mid) 40%,#e6f6ff);display:flex;flex-direction:column}
.map .mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.map .mhead h2{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0;color:#fff;text-shadow:0 2px 0 #1f4fb0}
.map .list{flex:1;overflow:auto;padding:4px 16px 28px;display:flex;flex-direction:column;gap:18px}
.district h3{margin:0 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.node{appearance:none;border:0;cursor:pointer;font:inherit;aspect-ratio:1;border-radius:50%;background:#fff;color:var(--ink);font-weight:800;font-size:15px;box-shadow:inset 0 -4px 0 #cfdcef;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;max-width:100%}
.node .st{display:flex;gap:1px}
.node.done{background:#e3f0ff}
.node.cur{background:var(--volt);color:#3a2c00;box-shadow:inset 0 -4px 0 var(--volt-d),0 0 0 3px rgba(255,201,40,.4)}
.node[disabled]{opacity:.45;cursor:default}

/* account + league sheets */
#accountBtn{position:relative}
#accountDot{position:absolute;right:3px;top:3px;width:9px;height:9px;border-radius:50%;background:#2fb36d;border:2px solid #fff}
.sheet{position:absolute;inset:0;z-index:28;background:rgba(22,48,79,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:#fff;width:100%;max-height:88%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(22,48,79,.25)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.sheet-head h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0;color:var(--ink)}
.sheet-body{overflow:auto;padding:4px 16px 22px;display:flex;flex-direction:column;gap:12px;color:var(--ink)}
.sheet-body p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase}
.field input{font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid #cfdcef;background:#f6f9fe;color:var(--ink)}
.field input:focus{outline:2px solid var(--btn);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center}
.row > *{min-width:0}
.btn.small{padding:9px 12px;font-size:14px}
.btn.ghost{background:#eef3fb;color:var(--ink);box-shadow:inset 0 -3px 0 #d6e1f1}
.btn.danger{background:#fff0ee;color:#c0392b;box-shadow:inset 0 -3px 0 #f3c9c3}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:800;letter-spacing:.08em;background:#f6f9fe;border:1.5px dashed #b8cbe6;border-radius:12px;padding:10px 12px;text-align:center;flex:1}
.tabs{display:flex;gap:6px;background:#eef3fb;border-radius:12px;padding:4px}
.tabs button{flex:1;appearance:none;border:0;background:none;font:inherit;font-weight:700;font-size:14px;padding:8px;border-radius:9px;color:var(--ink-soft);cursor:pointer}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(22,48,79,.15)}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#f6f9fe}
.item.me{background:#fff6d6;box-shadow:inset 0 0 0 1.5px var(--volt)}
.item .rk{width:26px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.item .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm small{display:block;font-weight:600;color:var(--ink-soft);font-size:12px}
.item .pt{font-weight:800;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--ink-soft);text-align:center}
.err{color:#c0392b;font-size:13px;font-weight:600;min-height:1em}
#gbtn{min-height:44px;display:flex;justify-content:center}
.divider{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:12px;font-weight:700}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#dde6f3}
</style>

<div id="app">

      <button class="iconbtn" id="leagueBtn" aria-label="Lig ve arkadaşlar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></button>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import {MAX_LEVEL, HOUSE_COLORS, DISTRICTS, district, DIRS, OPP, rotN, BASE, diff, stepsCW, stepsBest, generate, starsFor} from './engine.js';

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem('em_'+k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('em_'+k, JSON.stringify(v)); } catch(e){} }
};
const HINT_PRICE = 20, MOVES_PRICE = 25;
const BOLT = '<svg viewBox="0 0 24 24"><path d="M13.5 2 5 13.5h6l-1.5 8.5L19 10h-6.2z"/></svg>';

/* ================= three.js helpers ================= */
const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({color, roughness:.65, metalness:0}, o));
function mesh(geo, mat, x=0, y=0, z=0, parent){ const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; if (parent) parent.add(m); return m; }
function box(w, h, d, mat, x, y, z, parent){ return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, parent); }
function roundedRect(w, d, r){
  const s = new THREE.Shape(), x = -w/2, y = -d/2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + d - r);
  s.quadraticCurveTo(x + w, y + d, x + w - r, y + d); s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
function slab(w, d, h, r, bevel){
  const g = new THREE.ExtrudeGeometry(roundedRect(w, d, r), {depth:h, bevelEnabled:true, bevelThickness:bevel, bevelSize:bevel, bevelSegments:3, curveSegments:6});
  g.rotateX(-Math.PI/2); return g;
}
function prism(w, h, d, pts){
  const s = new THREE.Shape(); const p = pts || [[-w/2,0],[w/2,0],[0,h]];
  s.moveTo(p[0][0], p[0][1]); p.slice(1).forEach(q => s.lineTo(q[0], q[1])); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, {depth:d, bevelEnabled:false}); g.translate(0, 0, -d/2); return g;
}
function glowTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(255,240,160,1)'); g.addColorStop(.35,'rgba(255,205,60,.5)'); g.addColorStop(1,'rgba(255,190,40,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

/* ================= board scene ================= */
const canvas = $('boardCanvas');
let renderer, scene, camera, raycaster, glowTex;
const MAT = {}, GEO = {};
function initBoard(){
  renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(30, 1, .1, 100);
  raycaster = new THREE.Raycaster();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8fbf6a, 1.6));
  const sun = new THREE.DirectionalLight(0xfff2d8, 2.6);
  sun.position.set(-4, 10, 6); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024); sun.shadow.camera.left = -7; sun.shadow.camera.right = 7; sun.shadow.camera.top = 7; sun.shadow.camera.bottom = -7;
  sun.shadow.bias = -0.0008; sun.shadow.radius = 4;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xbfe0ff, .7); fill.position.set(5, 4, -3); scene.add(fill);
  glowTex = glowTexture();

  MAT.tile = std(0xf1ebde, {roughness:.9});
  MAT.tileGrass = std(0x8fd46e, {roughness:.95});
  MAT.tileTrafo = std(0xc9ced8, {roughness:.9});
  MAT.tileBolt = std(0xaab4c6, {roughness:.45, metalness:.5});

/* camera: fit the whole board AND the tallest buildings on the back row */
function fitCamera(){
  const w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h || !S) return;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const tilt = 52 * Math.PI / 180, fov = camera.fov * Math.PI / 180;
  const ox = (S.W - 1) / 2 + .55, oz = (S.H - 1) / 2 + .55;
  const pts = [];
  [-ox, ox].forEach(x => [-oz, oz].forEach(z => { pts.push(new THREE.Vector3(x, -.3, z)); pts.push(new THREE.Vector3(x, 1.05, z)); }));
  const dir = new THREE.Vector3(0, Math.sin(tilt), Math.cos(tilt));
  const target = new THREE.Vector3(0, .25, 0);
  // binary search the smallest distance where every corner is inside the frustum
  let lo = 2, hi = 60;
  for (let i = 0; i < 26; i++){
    const d = (lo + hi) / 2;
    camera.position.copy(target).addScaledVector(dir, d); camera.lookAt(target); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    const ok = pts.every(p => { const v = p.clone().project(camera); return Math.abs(v.x) <= .96 && Math.abs(v.y) <= .96; });
    if (ok) hi = d; else lo = d;
  }
  camera.position.copy(target).addScaledVector(dir, hi); camera.lookAt(target); camera.updateProjectionMatrix();
}

/* ---------- picking ---------- */
let down = null;
function addEventListeners(){
  canvas.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY}; });
  canvas.addEventListener('pointerup', e => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 12 || !S) return; down = null;
    const r = canvas.getBoundingClientRect();
    const p = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(p, camera);
    const hit = raycaster.intersectObjects(S.tiles.map(t => t.g), true)[0];
    if (!hit) return;
    let o = hit.object; while (o && !S.tiles.some(t => t.g === o)) o = o.parent;
    tap(S.tiles.find(t => t.g === o));
  });
  new ResizeObserver(() => fitCamera()).observe($('wrap'));
}

const Online = (() => {
  let cfg = null, me = null, revision = 0, saveTimer = null, saving = false;
  const ERR = {LOGIN_EXPIRED:'Süre doldu, yeniden dene.', INVALID_CODE:'Kod hatalı ya da süresi dolmuş.', INVALID_EMAIL:'E-posta adresini kontrol et.', RATE_LIMIT:'Çok sık denendi, biraz bekle.', EMAIL_UNAVAILABLE:'E-posta gönderilemedi, sonra tekrar dene.', PLAYER_NOT_FOUND:'Bu koda sahip oyuncu bulunamadı.', LOGIN_NOT_CONFIGURED:'Bu giriş yöntemi henüz açık değil.', INVALID_NAME:'Ad en az 2 harf olmalı.', INVALID_IDENTITY:'Giriş doğrulanamadı.'};
  const msg = e => ERR[e] || 'Bağlantı kurulamadı, tekrar dene.';
  async function call(path, body){
    const r = await fetch(API + path, body === undefined ? {credentials:'same-origin'} : {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || 'NETWORK'), {status: r.status});
    return j;
  }
  const localSave = () => ({max: maxLevel, coins, stars: store.get('stars', {}), char: (CHARS[charIdx] || {}).id});
  function applySave(sv){
    if (!sv) return;
    const st = store.get('stars', {});
    for (const [k, v] of Object.entries(sv.stars || {})) st[k] = Math.max(st[k] || 0, v);
    store.set('stars', st);
    maxLevel = Math.max(maxLevel, sv.max || 1); store.set('max', maxLevel);
    coins = Math.max(coins, sv.coins || 0); $('coins').textContent = coins; store.set('coins', coins);
  }
  async function sync(){
    if (!me) return;
    try {
      const r = await call('/progress'); revision = r.revision || 0; applySave(r.save);
      await push();
    } catch (e){}
  }
  async function push(){
    if (!me || saving) return; saving = true;
    try { const r = await call('/progress', {save: localSave(), revision}); revision = r.revision; }
    catch (e){ if (e.message === 'SAVE_CONFLICT'){ saving = false; return sync(); } }
    saving = false;
  }
  function saveSoon(){ if (!me) return; clearTimeout(saveTimer); saveTimer = setTimeout(push, 1500); }
  async function cleared(lv, actions, extra){
    if (!me) return;
    try { await call('/clear', {level: lv, actions, extra}); } catch (e){}
  }
  async function init(){
    try { cfg = await call('/config'); } catch { cfg = null; }
    if (!cfg) return;
    try { me = (await call('/me')).player; } catch {}
    $('accountDot').hidden = !me;
    if (me) sync();
  }

  /* ---------- sheets ---------- */
  function sheet(title, html){ $('sheetTitle').textContent = title; $('sheetBody').innerHTML = html; $('sheet').hidden = false; return $('sheetBody'); }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function openAccount(){
    if (!cfg){ sheet('Hesap', '<p>Hesap, bulutta kayıt ve lig özellikleri electricman.tusneldax.com adresinde açık. Bu önizlemede ilerlemen yalnızca bu cihazda saklanıyor.</p>'); return; }
    if (me) return accountView();
    const body = sheet('Giriş yap', `<p>Giriş yaparsan ilerlemen bulutta saklanır, telefon değiştirsen de kaybolmaz. Haftalık lige ve arkadaş listesine de katılırsın.</p>
      ${cfg.googleClientId ? '<div id="gbtn"></div>' : ''}
      ${cfg.googleClientId && cfg.email ? '<div class="divider">ya da</div>' : ''}
      ${cfg.email ? `<div class="field"><label for="em_email">E-posta</label><input id="em_email" type="email" inputmode="email" autocomplete="email" placeholder="ornek@mail.com"></div>
        <div class="field" id="codeField" hidden><label for="em_code">6 haneli kod</label><input id="em_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"></div>
        <button class="btn" id="emailGo">Kod gönder</button>` : ''}
      ${!cfg.googleClientId && !cfg.email ? '<p>Giriş yöntemleri henüz açılmadı.</p>' : ''}
      <div class="err" id="loginErr"></div>
      <p class="note">Giriş yaparak <a href="/kosullar" target="_blank" rel="noopener">Kullanım Koşulları</a> ve <a href="/gizlilik" target="_blank" rel="noopener">Gizlilik Politikası</a>'nı kabul edersin.</p>`);
    const err = t => { $('loginErr').textContent = t || ''; };
    const done = async () => { me = (await call('/me')).player; $('accountDot').hidden = !me; await sync(); accountView(); say(`Hoş geldin ${me.name}! İlerlemen artık bulutta.`); };
    if (cfg.googleClientId) googleButton(async token => { try { await call('/auth/google', {token}); await done(); } catch (e){ err(msg(e.message)); } });
    if (cfg.email){
      let challenge = null;
      body.querySelector('#emailGo').onclick = async ev => {
        const btn = ev.currentTarget; err(''); btn.disabled = true;
        try {
          const email = $('em_email').value.trim();
          if (!challenge){ await call('/auth/nonce', {}); challenge = (await call('/auth/email/request', {email})).challenge; $('codeField').hidden = false; $('em_code').focus(); btn.textContent = 'Giriş yap'; }
          else { await call('/auth/email', {email, challenge, code: $('em_code').value.trim()}); await done(); }
        } catch (e){ err(msg(e.message)); if (e.message === 'LOGIN_EXPIRED'){ challenge = null; $('codeField').hidden = true; btn.textContent = 'Kod gönder'; } }
        btn.disabled = false;
      };
    }
  }
  function accountView(){
    const body = sheet('Hesabım', `<div class="field"><label for="em_name">Oyuncu adın</label><div class="row"><input id="em_name" maxlength="24" value="${esc(me.name)}" style="flex:1"><button class="btn small" id="nameSave">Kaydet</button></div></div>
      <div class="field"><label>Arkadaş kodun</label><div class="row"><div class="codebox" id="myCode">${esc(me.code)}</div><button class="btn small ghost" id="copyCode">Kopyala</button></div></div>
      <p>İlerlemen bulutta: ${maxLevel}. bölüme kadar açık, ${Object.values(store.get('stars', {})).reduce((a, b) => a + b, 0)} yıldız.</p>
      <div class="err" id="accErr"></div>
      <button class="btn ghost" id="logout">Çıkış yap</button>
      <details><summary class="note" style="cursor:pointer">Hesabı sil</summary><div class="field" style="margin-top:10px"><p>Hesabın, bulut kaydın, lig puanların ve arkadaşlıkların kalıcı olarak silinir. Onaylamak için SIL yaz.</p><div class="row"><input id="delConfirm" placeholder="SIL" style="flex:1"><button class="btn small danger" id="delGo">Sil</button></div></div></details>`);
    const err = t => { $('accErr').textContent = t || ''; };
    body.querySelector('#nameSave').onclick = async () => { try { const r = await call('/profile', {name: $('em_name').value}); me.name = r.name; $('em_name').value = r.name; err(''); say('Adın güncellendi: ' + r.name); } catch (e){ err(msg(e.message)); } };
    body.querySelector('#copyCode').onclick = async () => { try { await navigator.clipboard.writeText(me.code); say('Kodun kopyalandı: ' + me.code); } catch { const r = document.createRange(); r.selectNodeContents($('myCode')); getSelection().removeAllRanges(); getSelection().addRange(r); } };
    body.querySelector('#logout').onclick = async () => { try { await call('/logout', {}); } catch {} me = null; $('accountDot').hidden = true; $('sheet').hidden = true; say('Çıkış yaptın. İlerlemen bu cihazda duruyor.'); };
    body.querySelector('#delGo').onclick = async () => { try { await call('/delete-account', {confirm: $('delConfirm').value.trim()}); me = null; $('accountDot').hidden = true; $('sheet').hidden = true; say('Hesabın silindi.'); } catch (e){ err(e.message === 'CONFIRM_DELETE' ? 'Onay için SIL yaz.' : msg(e.message)); } };
  }
  function googleButton(onToken){
    const render = async () => {
      try {
        const {nonce} = await call('/auth/nonce', {});
        google.accounts.id.initialize({client_id: cfg.googleClientId, nonce, callback: r => onToken(r.credential), ux_mode:'popup', use_fedcm_for_prompt:true});
        google.accounts.id.renderButton($('gbtn'), {theme:'outline', size:'large', shape:'pill', text:'continue_with', locale:'tr', width: Math.min(320, $('gbtn').clientWidth || 320)});
      } catch (e){ $('loginErr').textContent = msg(e.message); }
    };
    if (window.google?.accounts?.id) return render();
    const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true; sc.onload = render; document.head.appendChild(sc);
  }
  async function openLeague(tab = 'league'){
    if (!cfg){ sheet('Lig ve arkadaşlar', '<p>Haftalık lig ve arkadaş listesi electricman.tusneldax.com adresinde açık.</p>'); return; }
    if (!me){ sheet('Lig ve arkadaşlar', '<p>Haftalık lige katılmak ve arkadaş eklemek için giriş yap.</p><button class="btn" id="goLogin">Giriş yap</button>').querySelector('#goLogin').onclick = openAccount; return; }
    const body = sheet('Lig ve arkadaşlar', `<div class="tabs" role="tablist"><button role="tab" data-t="league" aria-selected="${tab === 'league'}">Haftalık lig</button><button role="tab" data-t="friends" aria-selected="${tab === 'friends'}">Arkadaşlar</button></div><div id="tabBody"><p class="note">Yükleniyor…</p></div>`);
    body.querySelectorAll('.tabs button').forEach(b => b.onclick = () => openLeague(b.dataset.t));
    const tb = $('tabBody');
    try {
      if (tab === 'league'){
        const L = await call('/league');
        const ends = new Date(L.ends).toLocaleDateString('tr-TR', {day:'numeric', month:'long'});
        tb.innerHTML = `<p>Bu hafta bitirdiğin her bölüm yıldız başına 10 puan getirir. Lig ${ends} günü sıfırlanır.</p><div class="list" style="margin-top:10px">${L.rows.length ? L.rows.map(r => `<div class="item${r.me ? ' me' : ''}"><span class="rk">${r.rank}</span><span class="nm">${esc(r.name)}<small>${r.levels} bölüm</small></span><span class="pt">${r.points}</span></div>`).join('') : '<p class="note">Bu hafta henüz kimse puan almadı. İlk sen ol!</p>'}</div>`;
      } else {
        const F = await call('/friends');
        tb.innerHTML = `<div class="field" style="margin-top:4px"><label for="fcode">Arkadaş kodu ile ekle</label><div class="row"><input id="fcode" placeholder="EM1A2B3C" maxlength="8" style="flex:1;text-transform:uppercase"><button class="btn small" id="fadd">Ekle</button></div><div class="err" id="fErr"></div></div>
          <p class="note">Senin kodun: <b>${esc(F.me.code)}</b></p>
          <div class="list">${F.friends.length ? F.friends.map(f => `<div class="item"><span class="nm">${esc(f.name)}<small>${f.status === 'accepted' ? f.max + '. bölümde' : f.incoming ? 'Seni eklemek istiyor' : 'İstek gönderildi'}</small></span>${f.incoming ? `<button class="btn small" data-acc="${esc(f.code)}">Kabul et</button>` : `<button class="btn small ghost" data-rm="${esc(f.code)}">${f.status === 'accepted' ? 'Çıkar' : 'İptal'}</button>`}</div>`).join('') : '<p class="note">Henüz arkadaşın yok. Kodunu paylaş ya da bir arkadaşının kodunu gir.</p>'}</div>`;
        const act = async (action, code) => { try { await call('/friends', {action, code}); openLeague('friends'); } catch (e){ $('fErr').textContent = msg(e.message); } };
        tb.querySelector('#fadd').onclick = () => act('request', $('fcode').value.trim().toUpperCase());
        tb.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => act('accept', b.dataset.acc));
        tb.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => act('remove', b.dataset.rm));
      }
    } catch (e){ tb.innerHTML = `<p class="err">${msg(e.message)}</p>`; }
  }
  return {init, saveSoon, cleared, openAccount, openLeague};
})();
$('accountBtn').onclick = () => Online.openAccount();
$('leagueBtn').onclick = () => Online.openLeague();
$('sheetClose').onclick = () => { $('sheet').hidden = true; };
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('sheet').hidden = true; });

/* ---------- main loop ---------- */
let lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; clockT += dt;
  for (let i = tweens.length - 1; i >= 0; i--){ const w = tweens[i], k = Math.min(1, (now - w.t0) / w.dur); w.fn(k); if (k >= 1){ tweens.splice(i, 1); w.done && w.done(); } }
  MAT.sheathOn.emissiveIntensity = .75 + Math.sin(clockT * 5) * .25;
  if (S && S.tiles){
    S.tiles.forEach(t => {
      if (t.glow){ const o = t.glow.material.opacity, tgt = t.glowTarget || 0; t.glow.material.opacity = o + (tgt - o) * .12; }
      if (t.sparks && t.broken) t.sparks.forEach((s, i) => { const a = clockT * 12 + i * 1.7; s.position.set(Math.sin(a) * .07, .26 + Math.abs(Math.sin(a * 1.3)) * .1, Math.cos(a * .9) * .07); s.visible = Math.sin(a * 3) > -.2; });
      const sm = t.house && t.house.userData.smoke; if (sm && sm[0].visible){ const b = t.house.userData.smokeAt; sm.forEach((s, i) => { const p = ((clockT * .5 + i / 3) % 1); s.position.set(b.x + Math.sin(p * 6) * .03, b.y + p * .3, b.z); s.material.opacity = .8 * (1 - p); }); }
      const fl = t.house && t.house.userData.flag; if (fl) fl.rotation.y = Math.sin(clockT * 4 + t.idx) * .25;
    });
  }
  animateMan(clockT);
  if (renderer && S) renderer.render(scene, camera);
  if (hRenderer) hRenderer.render(hScene, hCamera);
}

try {
  initBoard(); initHero();
  $('loading').hidden = true;
  renderSound();
  start(level);
  requestAnimationFrame(loop);
  Online.init();
} catch (e){
  $('loading').hidden = false;
  $('loading').textContent = '3D sahne açılamadı. Tarayıcın WebGL desteklemiyor olabilir.';
  console.error(e);
}
window.__em = { generate, diff, get S(){ return S; }, start, tap };
</script>
