<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6ec6ff">
<meta name="description" content="Electric Man: kabloları döndür, trafodan evlere akım ulaştır. 300 bölümlük 3D bulmaca oyunu. TusneldaX.">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Electric Man</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: one-screen phone game — header, 3D Electric Man + speech bubble, stats, 3D board canvas, tool bar.
   Deliberately single (sunny day) theme. */
:root{
  color-scheme: light;
  --sky-top:#6ec6ff; --sky-mid:#b9e6ff; --hill:#bfe8a8;
  --panel:rgba(255,255,255,.72); --panel-solid:#ffffff; --line:rgba(30,60,110,.14);
  --volt:#ffc928; --volt-d:#d99a00;
  --ink:#16304f; --ink-soft:#4f6a8a; --btn:#2f6fe8; --btn-d:#1f4fb0;
  --f-display:"Bungee", "Arial Black", system-ui, sans-serif;
  --f-body:"Rubik", system-ui, -apple-system, sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky-mid);color:var(--ink);font-family:var(--f-body);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:
    radial-gradient(60px 22px at 18% 9%, rgba(255,255,255,.9), transparent 70%),
    radial-gradient(80px 26px at 78% 15%, rgba(255,255,255,.85), transparent 70%),
    radial-gradient(70px 24px at 55% 6%, rgba(255,255,255,.7), transparent 70%),
    radial-gradient(160% 60% at 50% 115%, var(--hill) 0 42%, transparent 43%),
    linear-gradient(var(--sky-top), var(--sky-mid) 55%, #d9f3ff)}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px 0}
.brand{font-family:var(--f-display);font-size:15px;white-space:nowrap;letter-spacing:.04em;line-height:1;min-width:0;color:#1f4fb0;text-shadow:0 2px 0 #fff}
.brand small{display:block;font-family:var(--f-body);font-weight:700;font-size:10.5px;letter-spacing:.1em;color:#1f4f8a;text-shadow:none;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:5px 10px 5px 6px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:0 1px 0 var(--line)}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1a8,var(--volt) 45%,#e0a50c);box-shadow:inset 0 0 0 1.5px #c58f08;display:inline-grid;place-items:center;flex:0 0 auto}
.coin svg{width:11px;height:11px;fill:#7a5200}
.iconbtn{appearance:none;border:0;background:var(--panel);color:var(--ink);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;box-shadow:0 1px 0 var(--line)}
.iconbtn:focus-visible,.tool:focus-visible,.btn:focus-visible,.node:focus-visible{outline:2px solid var(--btn);outline-offset:2px}

.hero{display:flex;align-items:center;gap:6px;padding:0 16px 0 6px;height:124px;box-sizing:border-box}
#heroCanvas{width:104px;height:118px;flex:0 0 auto;display:block}
.bubble{position:relative;flex:1;min-width:0;background:#fff;color:var(--ink);border-radius:14px;padding:9px 12px;font-weight:600;font-size:13.5px;line-height:1.32;min-height:40px;display:flex;align-items:center;box-shadow:0 2px 0 var(--line)}
.bubble::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.bubble.pulse{animation:bub .3s ease-out}
@keyframes bub{0%{transform:scale(.96)}100%{transform:scale(1)}}

.status{display:flex;gap:10px;padding:2px 16px 0}
.stat{flex:1;min-width:0;background:var(--panel);border-radius:12px;padding:6px 12px;box-shadow:0 1px 0 var(--line)}
.stat .lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase}
.stat .val{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;margin-top:1px}
.stat .val small{font-size:13px;color:var(--ink-soft);font-weight:600}
.bar{height:5px;border-radius:3px;background:rgba(22,48,79,.12);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--volt);border-radius:3px;transition:width .25s}
.stat.warn .val{color:#d93a2b}

.boardwrap{flex:1;min-height:0;position:relative}
#boardCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-soft);font-weight:600;text-align:center;padding:0 24px}

.tools{display:flex;justify-content:center;gap:20px;padding:4px 16px 12px}
.tool{appearance:none;border:0;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;font:inherit;color:var(--ink);font-size:11px;font-weight:700;min-width:64px}
.tool .ico{width:52px;height:52px;border-radius:50%;background:var(--btn);box-shadow:inset 0 -4px 0 var(--btn-d),0 2px 6px rgba(31,79,176,.25);display:grid;place-items:center}
.tool .ico svg{width:28px;height:28px}
.tool[disabled]{opacity:.45;cursor:default}
.tool .badge{position:absolute;top:-2px;right:0;background:#e5484d;color:#fff;border-radius:999px;font-size:11px;font-weight:800;min-width:20px;height:20px;display:flex;align-items:center;gap:2px;justify-content:center;padding:0 5px;border:2px solid #fff}
.tool .badge .coin{width:13px;height:13px}.tool .badge .coin svg{width:8px;height:8px}

.modal{position:absolute;inset:0;background:rgba(22,48,79,.45);display:grid;place-items:center;z-index:30;padding:16px}
.card{background:#fff;border-radius:18px;padding:22px 20px 18px;width:min(320px,100%);text-align:center;box-shadow:0 14px 34px rgba(22,48,79,.3)}
.card h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 8px;text-wrap:balance;color:var(--ink)}
.card p{margin:0 0 16px;color:var(--ink-soft);font-size:14px;line-height:1.45}
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0 10px}
.card .btns{display:flex;flex-direction:column;gap:8px}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:15px;padding:12px;border-radius:12px;background:var(--btn);color:#fff;box-shadow:inset 0 -4px 0 var(--btn-d)}
.btn.alt{background:var(--volt);color:#3a2c00;box-shadow:inset 0 -4px 0 var(--volt-d)}
.btn[disabled]{opacity:.45;cursor:default}

.map{position:absolute;inset:0;z-index:26;background:linear-gradient(var(--sky-top),var(--sky-mid) 40%,#e6f6ff);display:flex;flex-direction:column}
.map .mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.map .mhead h2{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0;color:#fff;text-shadow:0 2px 0 #1f4fb0}
.map .list{flex:1;overflow:auto;padding:4px 16px 28px;display:flex;flex-direction:column;gap:18px}
.district h3{margin:0 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.node{appearance:none;border:0;cursor:pointer;font:inherit;aspect-ratio:1;border-radius:50%;background:#fff;color:var(--ink);font-weight:800;font-size:15px;box-shadow:inset 0 -4px 0 #cfdcef;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;max-width:100%}
.node .st{display:flex;gap:1px}
.node.done{background:#e3f0ff}
.node.cur{background:var(--volt);color:#3a2c00;box-shadow:inset 0 -4px 0 var(--volt-d),0 0 0 3px rgba(255,201,40,.4)}
.node[disabled]{opacity:.45;cursor:default}

/* account + league sheets */
#accountBtn{position:relative}
#accountDot{position:absolute;right:3px;top:3px;width:9px;height:9px;border-radius:50%;background:#2fb36d;border:2px solid #fff}
.sheet{position:absolute;inset:0;z-index:28;background:rgba(22,48,79,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:#fff;width:100%;max-height:88%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(22,48,79,.25)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.sheet-head h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0;color:var(--ink)}
.sheet-body{overflow:auto;padding:4px 16px 22px;display:flex;flex-direction:column;gap:12px;color:var(--ink)}
.sheet-body p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase}
.field input{font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid #cfdcef;background:#f6f9fe;color:var(--ink)}
.field input:focus{outline:2px solid var(--btn);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center}
.row > *{min-width:0}
.btn.small{padding:9px 12px;font-size:14px}
.btn.ghost{background:#eef3fb;color:var(--ink);box-shadow:inset 0 -3px 0 #d6e1f1}
.btn.danger{background:#fff0ee;color:#c0392b;box-shadow:inset 0 -3px 0 #f3c9c3}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:800;letter-spacing:.08em;background:#f6f9fe;border:1.5px dashed #b8cbe6;border-radius:12px;padding:10px 12px;text-align:center;flex:1}
.tabs{display:flex;gap:6px;background:#eef3fb;border-radius:12px;padding:4px}
.tabs button{flex:1;appearance:none;border:0;background:none;font:inherit;font-weight:700;font-size:14px;padding:8px;border-radius:9px;color:var(--ink-soft);cursor:pointer}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(22,48,79,.15)}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#f6f9fe}
.item.me{background:#fff6d6;box-shadow:inset 0 0 0 1.5px var(--volt)}
.item .rk{width:26px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.item .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm small{display:block;font-weight:600;color:var(--ink-soft);font-size:12px}
.item .pt{font-weight:800;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--ink-soft);text-align:center}
.err{color:#c0392b;font-size:13px;font-weight:600;min-height:1em}
#gbtn{min-height:44px;display:flex;justify-content:center}
.divider{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:12px;font-weight:700}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#dde6f3}
/* notification badges */
#leagueBtn,#msgBtn{position:relative}
.nbadge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#e5484d;color:#fff;font:800 10.5px/17px var(--f-body);text-align:center;border:2px solid #fff;box-sizing:content-box}
.ibadge{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#e5484d;color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center;margin-inline-start:6px;vertical-align:middle}
.item.req{background:#fff6d6;box-shadow:inset 0 0 0 1.5px var(--volt)}
.sub{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:6px 0 0}
select.lang{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid #cfdcef;background:#f6f9fe;color:var(--ink)}
/* chat */
.chat-top{display:flex;align-items:center;gap:8px}
.chat-top .nm{flex:1;min-width:0;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs{display:flex;flex-direction:column;gap:6px;min-height:200px;max-height:46vh;overflow:auto;padding:8px;background:#f2f6fc;border-radius:14px}
.msg{max-width:80%;padding:8px 11px;border-radius:14px;font-size:15px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.msg.in{align-self:flex-start;background:#fff;border-end-start-radius:4px;box-shadow:0 1px 0 var(--line)}
.msg.out{align-self:flex-end;background:var(--btn);color:#fff;border-end-end-radius:4px}
.msg .tr{display:block;margin-top:4px;font-size:11.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;text-decoration:underline}
.msg.out .tr{color:#d7e4ff}
.msg time{display:block;font-size:10.5px;opacity:.65;margin-top:2px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid #cfdcef;background:#f6f9fe;color:var(--ink);resize:none;height:44px;max-height:110px}
.chat-tools{display:flex;gap:8px;justify-content:flex-end}
.toast{position:absolute;left:50%;top:58px;transform:translateX(-50%);z-index:40;background:#16304f;color:#fff;padding:9px 14px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 20px rgba(22,48,79,.3);max-width:88%;cursor:pointer}
.hero{padding-top:6px}
.chip{border:0;font-family:inherit;color:var(--ink);cursor:pointer}
.chip .plus{width:16px;height:16px;border-radius:50%;background:#2fb36d;color:#fff;font-size:13px;line-height:16px;text-align:center;font-weight:800;margin-inline-start:2px}
.avatarbtn{padding:0;overflow:visible}
.avatarbtn img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:linear-gradient(#bfe6ff,#8fd0ff);display:block}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:linear-gradient(#bfe6ff,#8fd0ff);flex:0 0 auto}
.gender{display:flex;gap:12px;justify-content:center;margin:6px 0 14px}
.gender button{appearance:none;border:2px solid #dbe6f5;background:#f6f9fe;border-radius:16px;padding:10px 12px 8px;cursor:pointer;font:inherit;font-weight:800;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;width:120px}
.gender button[aria-pressed="true"]{border-color:var(--btn);background:#eaf2ff}
.gender img{width:84px;height:84px;border-radius:50%;object-fit:cover;background:linear-gradient(#bfe6ff,#8fd0ff)}
.shop-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#f6f9fe}
.shop-item .big{font-size:18px;font-weight:800;flex:1}
.shop-item .big small{display:block;font-size:12px;font-weight:600;color:var(--ink-soft)}
.shop-item .coin{width:30px;height:30px}.shop-item .coin svg{width:18px;height:18px}
.adcover{position:absolute;inset:0;z-index:60;background:rgba(10,20,40,.55)}
[dir=rtl] .bubble::before{left:auto;right:-7px;border-right-color:transparent;border-left:7px solid #fff;border-right:0}
</style>

<div id="app">
  <div class="top">
    <div class="brand">ELECTRIC<br>MAN<small id="lvl">KÖY · 1/300</small></div>
    <div class="chips">
      <button class="chip" id="coinChip" data-ta="aShop" aria-label="Jeton mağazası"><span class="coin"><svg viewBox="0 0 24 24"><path d="M13.5 2 5 13.5h6l-1.5 8.5L19 10h-6.2z"/></svg></span><span id="coins">0</span><span class="plus" aria-hidden="true">+</span></button>
      <button class="iconbtn" id="leagueBtn" data-ta="tabLeague" aria-label="Haftalık lig"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></button>
      <button class="iconbtn" id="msgBtn" data-ta="aMsg" aria-label="Mesajlar ve arkadaşlar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg><b id="msgBadge" class="nbadge" hidden>1</b></button>
      <button class="iconbtn avatarbtn" id="accountBtn" data-ta="aAccount" aria-label="Hesap"><img id="avatarImg" src="avatars/serhat.png" alt=""><i id="accountDot" hidden></i></button>
      <button class="iconbtn" id="mapBtn" data-ta="aMap" aria-label="Bölüm haritası"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button>
      <button class="iconbtn" id="restart" data-ta="aRestart" aria-label="Bölümü yeniden başlat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    </div>
  </div>
  <div class="hero">
    <canvas id="heroCanvas" role="button" data-ta="aHero" aria-label="Karakteri değiştir"></canvas>
    <div class="bubble" id="bubble" aria-live="polite">Merhaba!</div>
  </div>
  <div class="status">
    <div class="stat"><div class="lbl" data-t="litLbl">Aydınlanan ev</div><div class="val"><span id="lit">0</span> <small>/ <span id="houses">0</span></small></div><div class="bar"><i id="litbar"></i></div></div>
    <div class="stat" id="moveStat"><div class="lbl" data-t="movesLbl">Hamle</div><div class="val"><span id="moves">0</span> <small id="limitWrap">/ <span id="limit">0</span></small></div><div class="bar"><i id="movebar"></i></div></div>
  </div>
  <div class="boardwrap" id="wrap">
    <canvas id="boardCanvas" data-ta="aBoard" aria-label="Oyun tahtası: kabloya dokunarak döndür"></canvas>
    <div class="loading" id="loading" data-t="loading">3D sahne yükleniyor…</div>
  </div>
  <div class="tools">
    <button class="tool" id="undo"><span class="ico"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 9 5 15l6 6"/><path d="M5.5 15H19a7 7 0 0 1 0 14h-4"/></svg></span><span data-t="undo">Geri al</span><span class="badge" id="undoBadge"></span></button>
    <button class="tool" id="dirBtn" data-ta="aDir" aria-label="Dönüş yönünü değiştir"><span class="ico"><svg id="dirIco" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M25 16a9 9 0 1 1-3-6.7"/><path d="M23 4v6h-6"/></svg></span><span id="dirLbl">Saat yönü</span></button>
    <button class="tool" id="hintBtn"><span class="ico"><svg viewBox="0 0 32 32"><g stroke="#ffe680" stroke-width="1.8" stroke-linecap="round"><path d="M16 1.5v2.5M5.5 6l1.8 1.8M26.5 6l-1.8 1.8M2.5 15h2.5M27 15h2.5"/></g><path d="M16 6.5a8.3 8.3 0 0 0-4.9 15c.8.6 1.2 1.4 1.2 2.3h7.4c0-.9.4-1.7 1.2-2.3A8.3 8.3 0 0 0 16 6.5z" fill="#fff0a0" stroke="#fff" stroke-width="1.2"/><path d="M13.5 17.5l1.3-3 1.2 2 1.2-2 1.3 3v5" fill="none" stroke="#d29a0c" stroke-width="1.2" stroke-linejoin="round"/><rect x="12" y="23.5" width="8" height="5" rx="1.4" fill="#e3e8ef"/><path d="M12 25.3h8M12 27h8" stroke="#8a95a3" stroke-width=".9"/></svg></span><span data-t="hint">İpucu</span><span class="badge" id="hintBadge">1</span></button>
  </div>
  <div class="map" id="map" hidden><div class="mhead"><h2 data-t="mapTitle">TusneldaX · Harita</h2><button class="iconbtn" id="mapClose" data-ta="aClose" aria-label="Kapat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="list" id="mapList"></div></div>
  <div class="sheet" id="sheet" hidden><div class="sheet-card"><div class="sheet-head"><h2 id="sheetTitle"></h2><button class="iconbtn" id="sheetClose" data-ta="aClose" aria-label="Kapat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="sheet-body" id="sheetBody"></div></div></div>

function fitCamera(){
  const w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h || !S) return;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const tilt = 52 * Math.PI / 180, fov = camera.fov * Math.PI / 180;
  const ox = (S.W - 1) / 2 + .55, oz = (S.H - 1) / 2 + .55;
  const pts = [];
  [-ox, ox].forEach(x => [-oz, oz].forEach(z => { pts.push(new THREE.Vector3(x, -.3, z)); pts.push(new THREE.Vector3(x, 1.05, z)); }));
  const dir = new THREE.Vector3(0, Math.sin(tilt), Math.cos(tilt));
  const target = new THREE.Vector3(0, .25, 0);
  // binary search the smallest distance where every corner is inside the frustum
  let lo = 2, hi = 60;
  for (let i = 0; i < 26; i++){
    const d = (lo + hi) / 2;
    camera.position.copy(target).addScaledVector(dir, d); camera.lookAt(target); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    const ok = pts.every(p => { const v = p.clone().project(camera); return Math.abs(v.x) <= .96 && Math.abs(v.y) <= .96; });
    if (ok) hi = d; else lo = d;
  }
  camera.position.copy(target).addScaledVector(dir, hi); camera.lookAt(target); camera.updateProjectionMatrix();
}

  function play(name, fade = .12){ const a = acts[name]; if (!a || cur === a) return; a.reset().fadeIn(fade).play(); if (cur) cur.fadeOut(fade); cur = a; }
  function use(rec){
    if (!scene || recId === rec) return; recId = rec;
    const at0 = obj ? obj.position.clone() : null;
    if (obj) scene.remove(obj);
    obj = cloneSkinned(rec.scene); obj.rotation.set(0, 0, 0); obj.scale.setScalar(H / rec.height);
    obj.traverse(o => { if (o.isMesh){ o.castShadow = true; o.frustumCulled = false; } });
    mixer = new THREE.AnimationMixer(obj); acts = {}; cur = null;
    rec.clips.forEach(cl => acts[cl.name] = mixer.clipAction(cl));
    scene.add(obj); play('Idle', 0);
    if (at0) obj.position.copy(at0); else home();
  }
  function spot(t){ return new THREE.Vector3(t.g.position.x + .42, .115, t.g.position.z + .42); }
  function home(){
    if (!obj || !S) return; queue.length = 0; busy = false; gen++;
    const tr = S.tiles.find(t => t.kind === 'trafo'); obj.position.copy(spot(tr)); obj.rotation.y = -Math.PI * .75; play('Idle', 0);
  }
  function face(dx, dz){ if (Math.abs(dx) + Math.abs(dz) > 1e-4) obj.rotation.y = Math.atan2(dx, dz); }
  function walk(t, then){
    const g = gen, dest = spot(t), from = obj.position.clone(), d = from.distanceTo(dest);
    if (d < .05){ face(t.g.position.x - dest.x, t.g.position.z - dest.z); then(); return; }
    face(dest.x - from.x, dest.z - from.z); play('Run');
    const dur = Math.max(110, Math.min(320, d / SPEED * 1000));
    tween(dur, k => { if (g === gen) obj.position.lerpVectors(from, dest, k); }, () => {
      if (g !== gen) return;
      face(t.g.position.x - dest.x, t.g.position.z - dest.z); play('Idle'); then();
    });
  }
  function next(){
    const job = queue.shift();
    if (!job || !S || S.over){ queue.length = 0; busy = false; return; }
    busy = true; const g = gen;
    walk(job, () => { if (g !== gen) return; act(job); setTimeout(() => { if (g === gen) next(); }, 40); });
  }
  function request(t){
    if (!obj){ act(t); return; }
    if (queue.length < 4) queue.push(t);
    if (!busy) next();
  }
  function goTo(t){ if (!obj) return; queue.length = 0; gen++; busy = false; walk(t, () => {}); }
  function update(dt){ if (mixer) mixer.update(dt); }
  return {use, home, request, goTo, update, clear(){ queue.length = 0; gen++; busy = false; if (obj) play('Idle'); }};
})();
function tap(t){

  Worker.request(t);
}
function act(t){
  if (!S || S.over || !t || t.kind !== 'cable' || !S.tiles.includes(t)) return;

  if (t.broken){

function shake(o){ const x0 = o.position.x; tween(220, k => { o.position.x = x0 + Math.sin(k * Math.PI * 6) * .05 * (1 - k); }, () => o.position.x = x0); }

/* ---------- sound (synthesised) ---------- */
let actx = null;
function tone(f1, f2, dur, type, vol, atT){
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + (atT || 0);
  o.type = type; o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
}
function snd(k){
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    if (k === 'tap') tone(620, 380, .07, 'square', .035);
    else if (k === 'lit'){ tone(880, 0, .12, 'sine', .08); tone(1320, 0, .18, 'sine', .07, .08); }
    else if (k === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, 0, .22, 'triangle', .09, i * .11));
    else if (k === 'fail') tone(330, 160, .35, 'sawtooth', .05);
    else if (k === 'fix'){ tone(180, 520, .12, 'square', .04); tone(1200, 0, .06, 'sine', .05, .1); }
    else if (k === 'deny') tone(160, 120, .12, 'square', .04);
  } catch(e){}
}
function renderSound(){ const b = $('soundToggle'); if (b){ b.textContent = muted ? T('off') : T('on'); b.setAttribute('aria-pressed', String(!muted)); } }

      const b = sheet(T('loginTitle'), `<p>${esc(T('loginIntro'))}</p><button class="btn" id="appLogin">${esc(T('loginApp'))}</button><div class="err" id="loginErr"></div><p class="note">${legal()}</p><div class="field"><label>${esc(T('profilePic'))}</label>${Profile.picker()}</div>${settingsRow()}${langPicker()}`);
      bindLang(b); bindSettings(b);
      b.querySelector('#appLogin').onclick = async ev => { ev.currentTarget.disabled = true; try { await Native.call({action:'login', lang: LANG}); setMe((await call('/me')).player); if (me){ await sync(); accountView(); say(T('welcome', {name: me.name})); } } catch (e){ if (e.message !== 'LOGIN_CANCELLED') $('loginErr').textContent = msg(e.message); } ev.currentTarget.disabled = false; };
      return;
    }
    if (me) return accountView();
    const body = sheet(T('loginTitle'), `<p>${esc(T('loginIntro'))}</p>
      ${cfg.googleClientId ? '<div id="gbtn"></div>' : ''}
      ${cfg.googleClientId && cfg.email ? `<div class="divider">${esc(T('or'))}</div>` : ''}
      ${cfg.email ? `<div class="field"><label for="em_email">${esc(T('emailLbl'))}</label><input id="em_email" type="email" inputmode="email" autocomplete="email" placeholder="${esc(T('emailPh'))}"></div>
        <div class="field" id="codeField" hidden><label for="em_code">${esc(T('codeLbl'))}</label><input id="em_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"></div>
        <button class="btn" id="emailGo">${esc(T('sendCode'))}</button>` : ''}
      ${!cfg.googleClientId && !cfg.email ? `<p>${esc(T('noMethods'))}</p>` : ''}
      <div class="err" id="loginErr"></div>
      <p class="note">${legal()}</p><div class="field"><label>${esc(T('profilePic'))}</label>${Profile.picker()}</div>${settingsRow()}${langPicker()}`);
    bindLang(body); bindSettings(body);
    const err = t => { $('loginErr').textContent = t || ''; };
    const done = async () => { setMe((await call('/me')).player); await sync(); accountView(); say(T('welcome', {name: me.name})); };
    if (cfg.googleClientId) googleButton(async token => { try { await call('/auth/google', {token}); await done(); } catch (e){ err(msg(e.message)); } });
    if (cfg.email){
      let challenge = null;
      body.querySelector('#emailGo').onclick = async ev => {
        const btn = ev.currentTarget; err(''); btn.disabled = true;
        try {
          const email = $('em_email').value.trim();
          if (!challenge){ await call('/auth/nonce', {}); challenge = (await call('/auth/email/request', {email, lang: LANG})).challenge; $('codeField').hidden = false; $('em_code').focus(); btn.textContent = T('loginBtn'); }
          else { await call('/auth/email', {email, challenge, code: $('em_code').value.trim()}); await done(); }
        } catch (e){ err(msg(e.message)); if (e.message === 'LOGIN_EXPIRED'){ challenge = null; $('codeField').hidden = true; btn.textContent = T('sendCode'); } }
        btn.disabled = false;
      };
    }
  }
  function accountView(){
    const w = T('delWord'), stars = Object.values(store.get('stars', {})).reduce((a, b) => a + b, 0);
    const body = sheet(T('myAccount'), `<div class="field"><label for="em_name">${esc(T('nameLbl'))}</label><div class="row"><input id="em_name" maxlength="24" value="${esc(me.name)}" style="flex:1"><button class="btn small" id="nameSave">${esc(T('save'))}</button></div></div>
      <div class="field"><label>${esc(T('friendCodeLbl'))}</label><div class="row"><div class="codebox" id="myCode" dir="ltr">${esc(me.code)}</div><button class="btn small ghost" id="copyCode">${esc(T('copy'))}</button></div></div>
      <p>${esc(T('progressTxt', {m: maxLevel, s: stars}))}</p>
      <div class="field"><label>${esc(T('profilePic'))}</label>${Profile.picker()}</div>
      ${settingsRow()}
      ${langPicker()}
      <div class="err" id="accErr"></div>
      <button class="btn ghost" id="logout">${esc(T('logout'))}</button>
      <details><summary class="note" style="cursor:pointer">${esc(T('delAcc'))}</summary><div class="field" style="margin-top:10px"><p>${esc(T('delText', {w}))}</p><div class="row"><input id="delConfirm" placeholder="${esc(w)}" style="flex:1"><button class="btn small danger" id="delGo">${esc(T('del'))}</button></div></div></details>`);
    bindLang(body); bindSettings(body);
    const err = t => { $('accErr').textContent = t || ''; };
    body.querySelector('#nameSave').onclick = async () => { try { const r = await call('/profile', {name: $('em_name').value}); me.name = r.name; $('em_name').value = r.name; err(''); say(T('nameSaved', {n: r.name})); } catch (e){ err(msg(e.message)); } };
    body.querySelector('#copyCode').onclick = async () => { try { await navigator.clipboard.writeText(me.code); say(T('copied', {c: me.code})); } catch { const r = document.createRange(); r.selectNodeContents($('myCode')); getSelection().removeAllRanges(); getSelection().addRange(r); } };
    body.querySelector('#logout').onclick = async () => { try { await call('/logout', {}); } catch {} setMe(null); $('sheet').hidden = true; say(T('loggedOut')); };
    body.querySelector('#delGo').onclick = async () => { try { await call('/delete-account', {confirm: $('delConfirm').value.trim()}); setMe(null); $('sheet').hidden = true; say(T('deleted')); } catch (e){ err(e.message === 'CONFIRM_DELETE' ? T('confirmDel', {w}) : msg(e.message)); } };
  }
  function googleButton(onToken){
    const render = async () => {
      try {
        const {nonce} = await call('/auth/nonce', {});
        google.accounts.id.initialize({client_id: cfg.googleClientId, nonce, callback: r => onToken(r.credential), ux_mode:'popup', use_fedcm_for_prompt:true});
        google.accounts.id.renderButton($('gbtn'), {theme:'outline', size:'large', shape:'pill', text:'continue_with', locale: LANG, width: Math.min(320, $('gbtn').clientWidth || 320)});
      } catch (e){ $('loginErr').textContent = msg(e.message); }
    };
    if (window.google?.accounts?.id) return render();
    const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true; sc.onload = render; document.head.appendChild(sc);
  }
  const av = a => `<img class="av" src="avatars/${a === 'zeynep' ? 'zeynep' : 'serhat'}.png" alt="">`;
  function needLogin(title, text){
    if (!cfg){ sheet(title, `<p>${esc(T(text === 'leagueLogin' ? 'leaguePreview' : 'leaguePreview'))}</p>`); return true; }
    if (!me){ sheet(title, `<p>${esc(T(text))}</p><button class="btn" id="goLogin">${esc(T('loginBtn'))}</button>`).querySelector('#goLogin').onclick = openAccount; return true; }
    return false;
  }
  async function openLeague(){
    if (needLogin(T('tabLeague'), 'leagueLogin')) return;
    const tb = sheet(T('tabLeague'), `<p class="note">${esc(T('loadingTxt'))}</p>`);
    try {
      const lg = await call('/league');
      const ends = new Date(lg.ends).toLocaleDateString(LANG, {day:'numeric', month:'long'});
      tb.innerHTML = `<p>${esc(T('leagueInfo', {d: ends}))}</p><div class="list" style="margin-top:10px">${lg.rows.length ? lg.rows.map(r => `<div class="item${r.me ? ' me' : ''}"><span class="rk">${r.rank}</span>${av(r.avatar)}<span class="nm">${esc(r.name)}<small>${esc(T('levelsN', {n: r.levels}))}</small></span><span class="pt">${r.points}</span></div>`).join('') : `<p class="note">${esc(T('leagueEmpty'))}</p>`}</div>`;
    } catch (e){ tb.innerHTML = `<p class="err">${esc(msg(e.message))}</p>`; }
  }
  async function openFriends(){
    if (needLogin(T('aMsg'), 'leagueLogin')) return;
    const tb = sheet(T('aMsg'), `<p class="note">${esc(T('loadingTxt'))}</p>`);
    try {
      const F = await call('/friends');
      const reqs = F.friends.filter(f => f.incoming), rest = F.friends.filter(f => !f.incoming);
      rest.sort((x, y) => (y.unread || 0) - (x.unread || 0));
      const row = f => `<div class="item${f.incoming ? ' req' : ''}">${av(f.avatar)}<span class="nm">${esc(f.name)}<small>${esc(f.status === 'accepted' ? T('atLevel', {n: f.max}) : f.incoming ? T('wantsAdd') : T('reqSent'))}</small></span>${
        f.incoming ? `<button class="btn small" data-acc="${esc(f.code)}">${esc(T('accept'))}</button>` :
        f.status === 'accepted' ? `<button class="btn small" data-chat="${esc(f.code)}" data-name="${esc(f.name)}" data-av="${esc(f.avatar || '')}">${esc(T('message'))}${f.unread ? `<span class="ibadge">${f.unread}</span>` : ''}</button><button class="btn small ghost" data-rm="${esc(f.code)}">${esc(T('removeF'))}</button>` :
        `<button class="btn small ghost" data-rm="${esc(f.code)}">${esc(T('cancelReq'))}</button>`}</div>`;
      tb.innerHTML = `${reqs.length ? `<p class="sub">${esc(T('requestsHead'))}</p><div class="list">${reqs.map(row).join('')}</div>` : ''}
        ${rest.length ? `<p class="sub">${esc(T('friendsHead'))}</p><div class="list">${rest.map(row).join('')}</div>` : (reqs.length ? '' : `<p class="note">${esc(T('noFriends'))}</p>`)}
        <div class="field" style="margin-top:6px"><label for="fcode">${esc(T('addByCode'))}</label><div class="row"><input id="fcode" placeholder="EM1A2B3C" maxlength="8" dir="ltr" style="flex:1;text-transform:uppercase"><button class="btn small" id="fadd">${esc(T('add'))}</button></div><div class="err" id="fErr"></div></div>
        <p class="note">${T('yourCode', {c: `<b dir="ltr">${esc(F.me.code)}</b>`})}</p>`;
      const act = async (action, code) => { try { await call('/friends', {action, code}); await pollBadges(); openFriends(); } catch (e){ $('fErr').textContent = msg(e.message); } };
      tb.querySelector('#fadd').onclick = () => act('request', $('fcode').value.trim().toUpperCase());
      tb.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => act('accept', b.dataset.acc));
      tb.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => act('remove', b.dataset.rm));
      tb.querySelectorAll('[data-chat]').forEach(b => b.onclick = () => openChat(b.dataset.chat, b.dataset.name, b.dataset.av));
    } catch (e){ tb.innerHTML = `<p class="err">${esc(msg(e.message))}</p>`; }
  }

  /* ---------- chat: friends only, polled every 1.5 s while open, auto-translated into the reader's language ---------- */
  function stopChat(){ if (chat){ clearTimeout(chat.timer); chat = null; } }
  function openChat(code, name, avatar){
    const body = sheet(name, `<div class="chat-top"><button class="btn small ghost" id="chatBack">${LANG === 'ar' ? '→' : '←'} ${esc(T('back'))}</button>${av(avatar)}<span class="nm">${esc(name)}</span><button class="btn small ghost" id="chatBlock">${esc(T('block'))}</button><button class="btn small danger" id="chatReport">${esc(T('report'))}</button></div>
      <p class="note">${esc(T('chatSafety'))}</p>
      <div class="msgs" id="msgs" aria-live="polite"><p class="note">${esc(T('loadingTxt'))}</p></div>
      <div class="err" id="chatErr"></div>
      <div class="composer"><textarea id="chatIn" maxlength="300" placeholder="${esc(T('chatPh'))}" rows="1"></textarea><button class="btn small" id="chatSend">${esc(T('send'))}</button></div>`);
    chat = {code, name, last:0, seen:new Set(), timer:null, tr:{}, showOrig:new Set()};
    const me_ = chat, box = $('msgs'), input = $('chatIn'), err = t => { $('chatErr').textContent = t || ''; };
    const confirmThen = (q, f) => modal(T(q === 'blockQ' ? 'block' : 'report'), `<p>${esc(T(q, {n: name}))}</p>`, [{t: T('yes'), alt:true, f: async () => { $('modal').hidden = true; await f(); }}, {t: T('no'), f: () => { $('modal').hidden = true; }}]);
    $('chatBack').onclick = () => openFriends();
    $('chatBlock').onclick = () => confirmThen('blockQ', async () => { try { await call('/friends', {action:'block', code}); say(T('blocked', {n: name})); pollBadges(); openFriends(); } catch (e){ err(msg(e.message)); } });
    $('chatReport').onclick = () => confirmThen('reportQ', async () => { try { await call('/report', {code, reason:'chat'}); say(T('reported', {n: name})); pollBadges(); openFriends(); } catch (e){ err(msg(e.message)); } });
    const bubble = m => {
      const d = document.createElement('div'); d.className = 'msg ' + (m.mine ? 'out' : 'in'); d.dataset.id = m.id;
      const needTr = !m.mine && m.lang !== LANG;
      const txt = document.createElement('span'); d.appendChild(txt);
      const paint = () => {
        const t = chat && chat.tr[m.id], orig = !t || chat.showOrig.has(m.id);
        txt.textContent = orig ? m.text : t;
        let link = d.querySelector('.tr');
        if (needTr){
          if (!link){ link = document.createElement('span'); link.className = 'tr'; link.setAttribute('role', 'button'); link.tabIndex = 0; d.appendChild(link); link.onclick = () => { chat.showOrig.has(m.id) ? chat.showOrig.delete(m.id) : chat.showOrig.add(m.id); paint(); }; }
          link.textContent = !t ? T('translating') : orig ? T('showTr') : T('translatedFrom', {l: langName(m.lang)}) + ' · ' + T('showOrig');
        }
      };
      d.paint = paint; paint();
      const tm = document.createElement('time'); tm.textContent = fmtTime(m.created); d.appendChild(tm);
      return d;
    };
    async function translate(list){
      const ids = list.filter(m => !m.mine && m.lang !== LANG && !(m.id in chat.tr)).map(m => m.id);
      for (let i = 0; i < ids.length; i += 20){
        try {
          const r = await call('/translate', {ids: ids.slice(i, i + 20), to: LANG});
          if (chat !== me_) return;
          Object.assign(chat.tr, r.tr);
        } catch (e){ if (chat !== me_) return; ids.slice(i, i + 20).forEach(id => chat.tr[id] = chat.tr[id] || null); if (e.message === 'TRANSLATE_UNAVAILABLE') err(msg(e.message)); }
        box.querySelectorAll('.msg').forEach(d => { const m = +d.dataset.id; if (ids.includes(m)){ if (!chat.tr[m]){ const l = d.querySelector('.tr'); if (l) l.remove(); } else d.paint(); } });
      }
    }
    function add(list){
      const fresh = list.filter(m => !chat.seen.has(m.id)); if (!fresh.length) return;
      if (!chat.last) box.innerHTML = '';
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
      fresh.forEach(m => { chat.seen.add(m.id); chat.last = Math.max(chat.last, m.id); box.appendChild(bubble(m)); });
      if (atBottom || fresh.some(m => m.mine)) box.scrollTop = box.scrollHeight;
      translate(fresh);
    }
    async function poll(){
      if (chat !== me_) return;
      try {
        const r = await call('/chat?with=' + encodeURIComponent(code) + (chat.last ? '&after=' + chat.last : ''));
        if (chat !== me_) return;
        if (!chat.last && !r.messages.length) box.innerHTML = `<p class="note">${esc(T('chatEmpty'))}</p>`;
        if (r.messages.some(m => !m.mine)) badges.unread = 0;
        add(r.messages); err('');
      } catch (e){ if (chat !== me_) return; err(msg(e.message)); if (e.status === 403 || e.status === 404){ stopChat(); return; } }
      chat.timer = setTimeout(poll, document.hidden ? 8000 : 1500);
    }
    const send = async () => {
      const text = input.value.trim(); if (!text) return;
      $('chatSend').disabled = true;
      try { const r = await call('/chat', {to: code, text, lang: LANG}); input.value = ''; add([r.message]); err(''); }
      catch (e){ err(msg(e.message)); }
      $('chatSend').disabled = false; input.focus();
    };
    $('chatSend').onclick = send;
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
    poll(); setTimeout(() => pollBadges(), 2500);
  }
  return {init, saveSoon, cleared, openAccount, openLeague, openFriends, stopChat, sheet};
})();
$('accountBtn').onclick = () => Online.openAccount();
$('leagueBtn').onclick = () => Online.openLeague();
$('msgBtn').onclick = () => Online.openFriends();
$('sheetClose').onclick = () => { $('sheet').hidden = true; Online.stopChat(); };
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet'){ $('sheet').hidden = true; Online.stopChat(); } });

/* ---------- main loop ---------- */
let lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; clockT += dt;
  for (let i = tweens.length - 1; i >= 0; i--){ const w = tweens[i], k = Math.min(1, (now - w.t0) / w.dur); w.fn(k); if (k >= 1){ tweens.splice(i, 1); w.done && w.done(); } }
  MAT.sheathOn.emissiveIntensity = .45 + Math.sin(clockT * 5) * .12;
  if (S && S.tiles){
    S.tiles.forEach(t => {
      if (t.glow){ const o = t.glow.material.opacity, tgt = t.glowTarget || 0; t.glow.material.opacity = o + (tgt - o) * .12; }
      if (t.pulses){ const live = S.on.has(t) && !t.broken && !t.fog; t.pulses.forEach((sp, i) => { sp.visible = live; if (live){ const k = (clockT * .8 + t.idx * .37 + i * .5) % 1; sp.position.copy(GEO.curves[t.shape][i].getPointAt(k)); sp.position.y += .03; } }); }
      if (t.sparks && t.broken) t.sparks.forEach((s, i) => { const a = clockT * 12 + i * 1.7; s.position.set(Math.sin(a) * .07, .26 + Math.abs(Math.sin(a * 1.3)) * .1, Math.cos(a * .9) * .07); s.visible = Math.sin(a * 3) > -.2; });
      const sm = t.house && t.house.userData.smoke; if (sm && sm[0].visible){ const b = t.house.userData.smokeAt; sm.forEach((s, i) => { const p = ((clockT * .5 + i / 3) % 1); s.position.set(b.x + Math.sin(p * 6) * .03, b.y + p * .3, b.z); s.material.opacity = .8 * (1 - p); }); }
      const fl = t.house && t.house.userData.flag; if (fl) fl.rotation.y = Math.sin(clockT * 4 + t.idx) * .25;
    });
  }
  animateMan(clockT); Worker.update(dt);
  if (renderer && S) renderer.render(scene, camera);
  if (hRenderer) hRenderer.render(hScene, hCamera);
}

try {
  initBoard(); initHero();
  $('loading').hidden = true;
  renderSound(); Profile.render();
  start(level);
  if (!Profile.gender) setTimeout(() => Profile.ask(), 600);
  Ads.launch(); Shop.restorePending();
  requestAnimationFrame(loop);
  Online.init();
} catch (e){
  $('loading').hidden = false;
  $('loading').textContent = T('noGL');
  console.error(e);
}
window.__em = { generate, diff, stepsCW, setDir(cw){ dirCW = cw; }, get S(){ return S; }, start, tap, act, screenOf(){ const r = canvas.getBoundingClientRect(); return S.tiles.filter(t => t.kind === 'cable').map(t => { const v = new THREE.Vector3(t.g.position.x, .165, t.g.position.z).project(camera); return {idx:t.idx, fixed:!!t.fixed || !!t.fog, x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height}; }); } };
</script>
